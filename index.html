,goto:`sleepless`},{text:`发条朋友圈：「人生终于开始了」`,art:`c_post_moment`,effects:{joy:15,safety:-30},flags:[`posted`],result:`一分钟后，第一个赞。十分钟后，九十九+。你没注意到，有几个很久没联系的人，也点了赞。`,memory:`发了一条朋友圈`,goto:`sleepless`},{text:`等等……这一幕，你好像经历过？`,art:`c_deja_vu`,requires:[{seenCount:3}],lockedHint:`打出 3 个不同结局后解锁`,goto:`deja_vu`}]},{id:`deja_vu`,chapter:`序章 · 开奖之夜`,title:`似曾相识`,art:`deja_vu`,text:[`你突然想起来了。`,`你见过自己戴着头套领奖，见过亲戚堵在门口，见过凌晨三点的天花板。见过有人因为这笔钱笑，也见过有人因为它哭。`,`这一次，你还要去领吗？`],choices:[{text:`去领。这一次，我知道该怎么做`,art:`c_wise`,effects:{bond:10,safety:10},flags:[`wise`],result:`你把彩票平平整整地夹进文件夹。这一次，你不慌了。`,memory:`带着「上一辈子」的记忆，去领奖`,goto:`tax`},{text:`去领。但这次，先回家看看`,art:`c_home_first`,effects:{bond:15,joy:5},flags:[`wise`,`home_first`],result:`你买了最早一班车票。妈开门时愣住了：「怎么突然回来了？」你说：「想你们了。」那张彩票，在口袋里揣了三天。`,memory:`领奖前，先回了一趟家`,goto:`tax`},{text:`把彩票放回抽屉，继续过原来的日子`,art:`c_drawer`,result:`你关上抽屉，把那碗泡面吃完了。第二天闹钟照常响，你照常起床。窗外的天，和昨天一样。`,memory:`把彩票放回了抽屉`,goto:`end_unclaimed`}]},{id:`sleepless`,chapter:`序章 · 开奖之夜`,title:`睡不着`,art:`sleepless`,text:[`凌晨一点，你关了灯，又打开。`,`天花板上那块水渍，你看了三年，今晚第一次觉得它像一张笑脸。`,{if:[{flag:`o_driver`}],text:`这个点，你本该在高架上拉今晚的第五单。`},{if:[{flag:`o_coder`}],text:`工作群还在跳消息，明早九点有个上线。`},{if:[{flag:`o_teacher`}],text:`书桌上摊着四十多本没改完的作文。`},`你知道今晚是睡不着了。`],choices:[{text:`打开计算器，一遍遍算`,art:`c_calculator`,effects:{joy:10},flags:[`planner`],result:`房子、车子、爸妈的养老、辞职后的二十年……算到第五遍，你发现 4000 万好像也没有那么多。`,memory:`中奖当晚，算了五遍账`,goto:`tax`},{text:`搜「中奖的人后来怎么样了」`,art:`c_search_curse`,effects:{joy:-5,safety:10},flags:[`warned`],result:`搜索结果第一条：「七成大奖得主在几年内陷入困境」。你不知道这个数字真不真，但那一夜，你把每一条都看完了。`,memory:`查了一整夜「中奖者的下场」`,goto:`tax`},{text:`给妈打个电话，但什么都不说`,art:`c_call_mom`,effects:{bond:10},flags:[`called_mom`],result:`「这么晚还不睡？」「没事，就想听听你声音。」妈在那头絮叨了二十分钟楼下的猫。你一句都没插嘴。`,memory:`中奖当晚，给妈打了个电话`,goto:`tax`}]}],ee=[{id:`tax`,time:`第 1 天`,chapter:`第一关 · 税`,title:`1000 万`,art:`tax_night`,text:[`天亮之前，你把兑奖攻略翻了个遍。`,`单注奖金超过 1 万元，按「偶然所得」缴 20% 个税，由彩票机构直接代扣。5000 万，要交 1000 万。`,`早上七点，手机进来一条陌生短信：「大奖免税通道，手续费 5%，全程保密。」`],choices:[{text:`依法纳税，到手 4000 万`,art:`c_tax_pay`,effects:{cash:4e3,safety:10},flags:[`tax_paid`,`claimed`],result:`签完最后一个字，工作人员说：「恭喜，税款已代扣。」1000 万就这样消失了。你有点心疼，但睡得着。`,memory:`依法缴了 1000 万的税`,goto:`claim`},{text:`先捐 500 万做公益，再缴税`,hint:`捐赠可税前扣除，到手 3600 万`,art:`c_tax_donate`,effects:{cash:3600,joy:5,bond:5},flags:[`donated`,`claimed`],result:`你选了一个乡村儿童午餐项目。工作人员说，500 万够两千个孩子吃三年热饭。你少拿了 400 万，却第一次觉得这笔钱真的「中」了。`,memory:`领奖前，先捐了 500 万给孩子们的午餐`,goto:`claim`},{text:`回复那条「免税通道」短信`,art:`c_tax_evade`,flags:[`evade`],requires:[{notFlag:`walked_out`},{notFlag:`turned_in`}],lockedHint:`这条路，你已经看清了`,result:`对方秒回：「老板放心，我们做这行十年了。」`,memory:`回复了一条「免税通道」短信`,goto:`tax_evade`},{text:`太乱了，我再想想`,art:`c_hesitate`,effects:{joy:-5},requires:[{notFlag:`hesitated`}],lockedHint:`已经想过一次了`,flags:[`hesitated`],result:`你把彩票夹进一本《百年孤独》，放回书架。反正有 60 天，不急。`,memory:`把彩票夹进书里，想再等等`,goto:`claim_wait`}]},{id:`tax_evade`,time:`第 2 天`,chapter:`第一关 · 税`,title:`中间人`,art:`tax_middleman`,text:[`约在一家茶楼的包间。「中间人」戴着金链子，茶倒得很稳。`,`「找十个人分开代领，每人一注，都不到扣税线。」他把一张收款码推过来，「先交 20 万保证金，走流程。」`,`你看着那张收款码，心跳得很快。`],choices:[{text:`转了 20 万保证金`,art:`c_pay_deposit`,effects:{cash:-20,safety:-15},flags:[`deposit`],result:`转账成功。中间人笑了：「明天把彩票带来，剩下的交给我们。」`,memory:`给「中间人」转了 20 万保证金`,goto:`tax_evade_deep`},{text:`借口上厕所，从后门走了`,art:`c_back_door`,effects:{safety:5,joy:-5},flags:[`walked_out`],result:`你在马路边站了很久，然后拉黑了那个号码。回去的路上你想：「分开代领」这四个字，怎么听都不像合法的事。`,memory:`在茶楼里，从后门溜走了`,goto:`tax`}]},{id:`tax_evade_deep`,time:`第 3 天`,chapter:`第一关 · 税`,title:`最后一步`,art:`tax_handover`,text:[`第二天，还是那个包间。中间人伸出手：「彩票给我。」`,`你攥着口袋里那张纸，手心全是汗。门外好像有人在走动。`],choices:[{text:`把彩票交给他`,art:`c_hand_ticket`,result:`他把彩票收进一个牛皮纸信封，拍拍你的肩：「三天后等消息。」`,memory:`把彩票交给了一个陌生人`,goto:{pick:[{to:`tax_police`,weight:1},{to:`tax_gone`}]}},{text:`「不了。」转身去税务局自首`,art:`c_turn_in`,effects:{safety:15},flags:[`turned_in`],result:`工作人员听完，说你能及时收手、主动说明，情况不算严重。那 20 万保证金，大概是追不回来了。`,memory:`在最后一刻收手，去税务局说明了情况`,goto:`tax`}]},{id:`tax_police`,chapter:`第一关 · 税`,title:`清晨六点的敲门声`,art:`tax_police`,text:[`第三天早上六点，有人敲门。`,`门外站着两名警察：「那个团伙落网了，你涉嫌参与偷逃税款，请配合调查。」`],choices:[{text:`……跟他们走`,memory:`被带走调查`,goto:`end_arrested`}]},{id:`tax_gone`,chapter:`第一关 · 税`,title:`空号`,art:`tax_gone`,text:[`三天后，那个号码变成了空号。茶楼说，包间是按小时租的。`,`你报了警。警察问你：「彩票是在哪家站点买的？号码记得吗？」你记得。可是彩票，已经被别人领走了。`],choices:[{text:`……蹲在路边，很久没站起来`,memory:`彩票被「中间人」骗走了`,goto:`end_conned`}]},{id:`claim_wait`,time:`第 58 天`,chapter:`第一关 · 税`,title:`第 58 天`,art:`claim_calendar`,text:[`每天睡前，你都要把那本书翻开，看一眼彩票还在不在。`,`兑奖期是开奖之日起 60 天。今天是第 58 天。`],choices:[{text:`马上出发`,art:`c_rush`,result:`你打了一辆车，一路催司机。到兑奖中心的时候，离下班还有 15 分钟。`,memory:`第 58 天，终于去兑奖了`,goto:`tax`},{text:`还有两天呢，明天再说`,hint:`真的吗？`,art:`c_tomorrow`,result:`第 59 天，你睡到中午。第 60 天，你出门时才发现：彩票不在那本书里。`,memory:`兑奖期最后两天，还在拖`,goto:`claim_lastday`}]},{id:`claim_lastday`,time:`第 60 天`,chapter:`第一关 · 税`,title:`第 60 天 · 下午三点`,art:`claim_search`,text:[`你把书架上每一本书都抖了一遍。地上全是书。`,`下午三点，你终于在《百年孤独》隔壁那本《活着》里找到了它。兑奖中心五点下班。`,`外面下着大雨，打车软件显示：前面排队 46 人。`],choices:[{text:`冲进雨里，跑过去`,art:`c_run_rain`,effects:{joy:5},result:`你跑了四公里。冲进大厅时浑身湿透，保安差点拦住你。时间：四点五十一分。`,memory:`在最后一天的大雨里，跑去兑了奖`,goto:`tax`},{text:`坐在地上，等车`,art:`c_wait_car`,result:`车来的时候，是五点二十分。`,memory:`兑奖期最后一天，没赶上`,goto:`end_lost_ticket`}]}],_=[{if:[{flag:`posted`}],to:`rumor`},{to:`tell`}],v=[{id:`claim`,time:`第 3 天`,chapter:`第二关 · 领奖`,title:`要不要露脸`,art:`claim_center`,text:[`兑奖大厅比你想象的安静。工作人员说：露不露脸，你自己决定，没有人能要求你露脸。`,`柜子里摆着一排卡通头套。门口，一位记者已经举起了相机。`,{if:[{flag:`posted`}],text:`你的手机一直在震。那条朋友圈下面，已经有人在问「是不是你」。`}],choices:[{text:`戴上卡通头套，低调领奖`,art:`c_mask`,effects:{safety:15},flags:[`masked`],result:`你戴着一只咧嘴笑的小熊头套，举着那块巨大的支票板拍了照。头套里很闷，你在里面偷偷哭了一下。`,memory:`戴着小熊头套领了奖`,goto:`bank_vip`},{text:`摘下口罩，大方接受采访`,art:`c_interview`,effects:{joy:10,safety:-25},flags:[`famous`],result:`「打算怎么花？」「先给爸妈买套房！」当晚，你的脸上了本地新闻。标题叫《28 岁幸运儿：我要让爸妈过上好日子》。`,memory:`露脸领奖，上了本地新闻`,goto:`bank_vip`}]},{id:`bank_vip`,time:`第 3 天`,chapter:`第二关 · 领奖`,title:`VIP 室`,art:`bank_vip`,text:[`奖金要打进银行卡。你刚走进营业厅，一位西装笔挺的客户经理就迎了上来：「这边请。」`,`VIP 室里有真皮沙发和现磨咖啡。经理递来一份烫金的册子：「专属私行产品，年化 8%，只对您这样的客户开放。」`],choices:[{text:`签了，先买 1000 万`,art:`c_bank_product`,effects:{cash:-1e3,joy:5},flags:[`bank_product`],result:`经理亲自帮你填好了每一页，你只需要签名。「放心，我们银行的产品，您还不放心吗？」`,memory:`在银行 VIP 室，签了一份 1000 万的「专属产品」`,goto:_},{text:`只办张卡，什么都不买`,art:`c_bank_card`,effects:{safety:5},result:`经理的笑容僵了一秒，又恢复了：「没关系，您随时找我。」他的名片，你转身就夹进了钱包最里层。`,memory:`在银行只办了一张卡`,goto:_},{text:`请他推荐律师和税务顾问`,art:`c_advisor`,effects:{cash:-10,safety:10},flags:[`advisor`],result:`一周后，你见到了周律师。她第一句话是：「接下来半年，任何人让你签字，都先拍给我看。」`,memory:`请了一位律师当顾问`,goto:_}]}],y=[{if:[{flag:`told_friend`}],to:`friend_call`},{to:`job`}],te=[{id:`rumor`,time:`第 1 周`,chapter:`第三关 · 秘密`,title:`朋友圈炸了`,art:`tell_rumor`,text:[`那条朋友圈下面有 87 条评论。`,`公司群里已经有人在问：「是不是中彩票了？请客请客！」`],choices:[{text:`否认到底：「就是涨工资了」`,art:`c_deny`,effects:{safety:10,bond:-5},result:`没人信。但大家都很配合地「哦」了一声。从那天起，同事跟你说话，都多了半秒的停顿。`,memory:`在公司否认中了奖`,goto:`tell`},{text:`承认，请全公司喝奶茶`,art:`c_milk_tea`,effects:{cash:-1,bond:10,safety:-20},flags:[`famous`],result:`三百杯奶茶，整栋楼都知道了。那天下午，你收到了 23 个好友申请。`,memory:`请整栋楼喝了奶茶`,goto:`tell`}]},{id:`tell`,time:`第 1 周`,chapter:`第三关 · 秘密`,title:`要告诉谁`,art:`tell_table`,text:[`钱到账了，心却悬着。`,{if:[{flag:`warned`}],text:`你想起那晚搜到的那些故事——很多人的麻烦，都是从「告诉了谁」开始的。`},`这个秘密，你打算和谁分享？`],choices:[{text:`告诉恋人，两个人一起扛`,art:`c_tell_partner`,effects:{bond:10},flags:[`partner`],result:`你们在一起四年了。听完，对方愣了很久，然后说：「那……明天还上班吗？」你们一起笑出了眼泪。`,memory:`把秘密告诉了在一起四年的恋人`,goto:y},{text:`告诉爸妈和全家，一起高兴`,art:`c_tell_family`,effects:{bond:15,joy:5,safety:-15},flags:[`told_family`],result:`爸在电话那头半天没说话，后来你才知道他躲进阳台抹了眼泪。第二天，七大姑八大姨都知道了。`,memory:`告诉了全家`,goto:y},{text:`谁都不说，做个隐形富豪`,art:`c_tell_nobody`,effects:{safety:20,bond:-10},flags:[`secret`],result:`你把银行短信设成了免打扰。全世界只有你一个人知道。有时候这让你很安心，有时候让你很孤单。`,memory:`决定谁都不告诉`,goto:y}]},{id:`friend_call`,time:`第 2 周`,chapter:`第三关 · 秘密`,title:`阿杰`,art:`friend_call`,text:[`阿杰约你吃烧烤。他是你大学室友，当年你交不起学费，是他把奖学金借给你的。`,`喝到第三瓶，他开口：「我爸查出肾病，透析一年十几万……能先借我 20 万吗？」`,`可上个月，同学群里有人说：阿杰在借网贷，欠了不少。`],choices:[{text:`借，但钱直接打给医院`,art:`c_lend_jie`,effects:{cash:-20,bond:-5,safety:5},flags:[`helped_jie`],result:`阿杰愣了一下，说：「行。」后半顿饭，谁都没再说话。后来你才知道，网贷是真的——是他为了凑透析费借的。`,memory:`借给阿杰 20 万，钱直接打给了医院`,goto:`job`},{text:`「不用还。」直接转给他`,art:`c_gift_jie`,effects:{cash:-20,bond:10,safety:-10},flags:[`gifted_jie`],result:`阿杰红着眼睛骂了你一句脏话，又开了一瓶。这钱最后花在了透析上，还是填了网贷，你没问，也不敢问。`,memory:`给了阿杰 20 万，没让他还`,goto:`job`},{text:`找个理由，推掉了`,art:`c_refuse_jie`,effects:{bond:-15,safety:5},flags:[`refused_jie`],result:`「钱都在理财里，取不出来。」阿杰说「没事没事」，抢着结了账。临走他说：「网贷的事，你听说了吧。」他没解释，你也没问。`,memory:`没借钱给阿杰`,goto:`job`}]}],b=`@resume`,x=e=>({then:e,pick:[{if:[{flag:`famous`}],to:`ev_doxxed`,weight:2},{if:[{flag:`famous`}],to:`ev_livestream`,weight:2},{if:[{flag:`car`}],to:`ev_scratch`,weight:2},{if:[{flag:`keep_job`}],to:`ev_boss_invest`,weight:2},{if:[{flag:`house`}],to:`ev_house_price`,weight:2},{to:`ev_reunion`},{to:`ev_lottery_shop`},{to:`ev_wallet`},{to:`ev_ex`},{to:`ev_charity_scam`},{to:`ev_hometown`},{to:`ev_ticket_claim`},{to:`ev_dog`},{to:`ev_wedding`},{to:`ev_course`},{to:`ev_old_teacher`},{to:`ev_rich_club`}]}),ne=[{id:`ev_blackmail`,chapter:`插曲 · 一封信`,title:`门缝里的信封`,art:`ev_blackmail`,text:[`早上出门，你踩到一个塞进门缝的信封。`,`里面是一张你家楼下的照片，和一行打印的字：「准备 50 万。别报警，我们知道你每天几点出门。」`],choices:[{text:`报警，并且搬家`,art:`c_blackmail_police`,effects:{cash:-30,safety:25,joy:-5},flags:[`moved`],result:`警察调了监控，三天后抓到了人：是你以前小区的一个保安。你搬进了有门禁的新小区，可还是会在半夜醒来，确认门锁好了没有。`,memory:`收到敲诈信，报警搬了家`,goto:b},{text:`按信上说的，给钱了事`,art:`c_blackmail_pay`,effects:{cash:-50,safety:-10},flags:[`paid_blackmail`],result:`钱放进指定的垃圾桶后，世界安静了一个月。然后，第二封信来了。`,memory:`向敲诈者付了 50 万`,goto:b}]},{id:`ev_doxxed`,chapter:`插曲 · 热搜`,title:`你被扒了`,art:`ev_doxxed`,text:[`一个帖子冲上了本地热搜：《起底 5000 万得主》。`,`你的小区、你的车牌、你大学时的丑照，全在里面。评论区有人说「祝你早日败光」，点赞最高。`],choices:[{text:`请律师，发律师函`,art:`c_lawyer_letter`,effects:{cash:-5,safety:15,joy:-5},flags:[`lawyer_letter`],result:`帖子删了，但截图早就传遍了。律师说：「能做的我们都做了。剩下的，交给时间。」`,memory:`被网友人肉，发了律师函`,goto:b},{text:`注销所有社交账号`,art:`c_go_offline`,effects:{safety:10,joy:-5,bond:-5},flags:[`offline`],result:`你注销了用了十年的账号。那里面有你所有的旧照片和老朋友。你没有备份。`,memory:`注销了用了十年的社交账号`,goto:b},{text:`写一篇长文，好好回应`,art:`c_long_post`,effects:{joy:-10,safety:-5,bond:5},result:`你写到凌晨四点。第二天，一半人说你真诚，一半人说你在炫富。你终于明白：没有一种回应能让所有人满意。`,memory:`在网上写长文回应了网暴`,goto:b}]},{id:`ev_livestream`,chapter:`插曲 · 直播间`,title:`「家人们」`,art:`ev_livestream`,text:[`一家 MCN 公司找上门：「你现在自带流量。签约一年，保底一百万。」`,`他们给你写好了人设：「5000 万得主的省钱好物分享」。`],choices:[{text:`签约，开播`,art:`c_go_live`,effects:{cash:100,joy:5,safety:-15},flags:[`streamer`],result:`第一场直播，在线三万人。你喊「家人们」喊到嗓子哑。下播后你一个人坐在补光灯前，不想说话。`,memory:`签约 MCN，做起了带货主播`,goto:b},{text:`只做一场助农直播`,art:`c_charity_live`,effects:{bond:10,joy:5,safety:-5},flags:[`charity_live`],result:`你帮老家卖掉了三万斤滞销的橙子，一分没拿。果农大叔给你寄了一箱，附了张字条：「甜不甜？」`,memory:`做了一场助农直播，一分没拿`,goto:b},{text:`婉拒，关掉手机`,art:`c_decline_mcn`,effects:{safety:5},result:`对方说：「流量是有保质期的，你会后悔的。」你关掉手机，去楼下吃了碗面。`,memory:`拒绝了做网红`,goto:b}]},{id:`ev_scratch`,chapter:`插曲 · 一道划痕`,title:`刮花了`,art:`ev_scratch`,text:[`你的跑车停在路边，一辆外卖电动车擦了过去，车门上一道长长的划痕。`,`外卖小哥脸都白了，攥着手机一直鞠躬：「对不起对不起……我一个月才挣六千……」`],choices:[{text:`「算了，你走吧。」`,art:`c_let_go`,effects:{joy:10,bond:5},flags:[`kind`],result:`他愣了半天，最后把一份没送出去的奶茶塞给你，骑车跑了。那杯奶茶是全糖的，你喝完了。`,memory:`放走了刮花跑车的外卖小哥`,goto:b},{text:`按流程报保险`,art:`c_insurance`,effects:{safety:5},result:`保险公司处理得很快。小哥留下了电话，一直说「我会还的」。后来，他真的每个月转你两百块，你一直没收。`,memory:`跑车被刮，按流程走了保险`,goto:b},{text:`让他照价赔偿`,art:`c_demand_pay`,effects:{joy:-5,bond:-10},flags:[`harsh`],result:`修车费八万。他签了分期，按手印的时候手在抖。你拿到了钱，却连着好几天没开那辆车。`,memory:`让外卖小哥赔了八万修车费`,goto:b}]},{id:`ev_boss_invest`,chapter:`插曲 · 老板的电话`,title:`老板求你`,art:`ev_boss_invest`,text:[`公司资金链断了。老板把你叫进办公室，第一次给你泡了茶。`,`「三百万，算你入股。」他搓着手，「不然这个月，大家的工资都发不出来。」`],choices:[{text:`投，就当给同事发工资`,art:`c_save_company`,effects:{cash:-300,bond:10},flags:[`boss_invest`],result:`那个月工资准时到账。没人知道是谁的钱。茶水间里，大家还在骂老板抠门，你跟着笑了。`,memory:`投了 300 万，救了公司`,goto:b},{text:`拒绝，顺便辞职`,art:`c_quit_now`,effects:{joy:10,safety:-5},flags:[`quit`],result:`你把工牌放在他桌上。走出大楼，阳光有点刺眼。你突然不知道下午该干什么。`,memory:`拒绝老板借钱，顺便辞了职`,goto:b},{text:`拒绝，照常上班`,art:`c_refuse_boss`,effects:{safety:5,joy:-5},result:`老板说「理解理解」。第二周，你的工位被调到了靠厕所的角落。`,memory:`拒绝了老板的借钱`,goto:b}]},{id:`ev_house_price`,chapter:`插曲 · 房价`,title:`跌了三成`,art:`ev_house_price`,text:[`小区业主群炸了：隔壁同户型，挂牌价比你买的时候低了三成。`,`有人在群里发了一串哭脸，有人说「抄底的机会来了」。`],choices:[{text:`赶紧卖掉，换成现金`,art:`c_sell_house`,effects:{cash:800,joy:-10,safety:-5},flags:[`sold_house`],result:`你亏了四百万，换回了一张存单。搬走那天，你在空客厅里站了一会儿，好像从没真正住过这里。`,memory:`房价大跌，割肉卖了房`,goto:b},{text:`不卖，反正是自己住`,art:`c_keep_house`,effects:{joy:5,safety:5},result:`你把业主群设成了免打扰，周末在阳台上种了几盆薄荷。房子是用来住的，你想。`,memory:`房价大跌，没卖，自己住着`,goto:b},{text:`抄底，再买一套`,art:`c_buy_dip`,effects:{cash:-800,safety:-10,joy:5},flags:[`second_house`],result:`你签了第二套。中介说你「眼光毒辣」。半年后它又跌了一成，中介不再接你电话了。`,memory:`抄底又买了一套房`,goto:b}]},{id:`ev_reunion`,chapter:`插曲 · 同学会`,title:`十年同学会`,art:`ev_reunion`,text:[`十年没见的同学会，包间订在全市最贵的酒楼。`,`以前不跟你说话的班花班草，今天轮流来敬酒。散场时，班长笑着把账单推到你面前：「你现在不差这点吧？」`],choices:[{text:`笑着把单买了`,art:`c_pay_bill`,effects:{cash:-3,bond:5,joy:-5},result:`三万八。大家鼓掌。第二天，同学群里多了十几条「改天单独聚」，你一条都没回。`,memory:`同学会上买了三万八的单`,goto:b},{text:`「AA 吧，跟以前一样。」`,art:`c_split_bill`,effects:{joy:5,bond:-5},result:`空气安静了两秒。坐你旁边的老同桌第一个掏出手机：「对，AA，跟以前一样。」你记住了这个人。`,memory:`同学会坚持 AA`,goto:b},{text:`提前走，去吃路边摊`,art:`c_street_food`,effects:{joy:10},result:`你在学校后门找到了那家开了十五年的炒粉摊。老板还认得你：「加辣，不要葱，对吧？」`,memory:`同学会中途溜去了学校后门的炒粉摊`,goto:b}]},{id:`ev_lottery_shop`,chapter:`插曲 · 彩票站`,title:`你的大红喜报`,art:`ev_lottery_shop`,text:[`路过那家彩票站，门口挂着大红喜报：「热烈祝贺本站喜中 5000 万」。`,`老板一眼认出了你，热情地招手：「福星来了！手气好的人，要多买，好运是会连着来的！」`],choices:[{text:`再买一注，就当好玩`,art:`c_buy_again`,effects:{cash:-1,joy:5},flags:[`lottery_again`],result:`你选了和上次一模一样的号码。没中。但等开奖的那一晚，你又找回了一点久违的心跳。`,memory:`又买了一注彩票`,goto:b},{text:`每期都买，买到再中`,art:`c_buy_every`,effects:{cash:-50,joy:-5,safety:-10},flags:[`lottery_again`,`lottery_habit`],result:`你开了一个专门的账户，每期十万。老板给你留了专属座位。你告诉自己：我买得起。`,memory:`开始每期花十万买彩票`,goto:b},{text:`请老板把喜报摘了`,art:`c_take_down`,effects:{safety:10},result:`老板不太情愿，你给他买了两条烟。走的时候你回头看了一眼：那家店，和你中奖前一模一样了。`,memory:`请彩票站摘下了喜报`,goto:b}]},{id:`ev_wallet`,chapter:`插曲 · 一个钱包`,title:`捡到的钱包`,art:`ev_wallet`,text:[`地铁座位上，有人落下了一个旧钱包。`,`里面有两千块现金，一张身份证，和一张折得很小的住院缴费单：欠费 4.8 万。`],choices:[{text:`送去派出所`,art:`c_to_police`,effects:{joy:5,bond:5},result:`民警说，失主是一个从外地来给孩子看病的父亲。他找到钱包时，在派出所门口哭了。`,memory:`把捡到的钱包送去了派出所`,goto:b},{text:`去医院，替他把费交了`,art:`c_pay_bill_hospital`,effects:{cash:-5,joy:10,bond:10},flags:[`kind`],result:`你把钱包交给护士站，顺手把欠费结清了，没留名字。走出医院，你觉得这是中奖以来花得最值的一笔。`,memory:`替一个陌生人交清了住院费`,goto:b}]},{id:`ev_ex`,chapter:`插曲 · 旧人`,title:`{ex}`,art:`ev_ex_{lover}`,text:[`{ex}发来一条消息：「好久不见。听说你最近过得很好。」`,`当年{ta}说「你给不了我想要的生活」，然后走了。现在{ta}约你喝咖啡。`,{if:[{flag:`partner`}],text:`你看了一眼身边正在剥橘子的伴侣。`}],choices:[{text:`见一面，好好告别`,art:`c_closure`,effects:{joy:10},flags:[`closure`],result:`{ta}老了一点，你也是。你们聊了很久，谁都没提钱。分开时{ta}说：「当年对不起。」你说：「都过去了。」是真的过去了。`,memory:`和{ex}好好告了别`,goto:b},{text:`{ta}开口借钱，借了`,art:`c_lend_ex`,effects:{cash:-30,joy:-10,bond:-5},flags:[`ex_loan`],result:`咖啡喝到一半，{ta}说起了自己的难处。你借了三十万。回家路上你才反应过来：{ta}连你现在住哪都没问。`,memory:`借给{ex}三十万`,goto:b},{text:`不回，直接删除`,art:`c_delete_ex`,effects:{safety:5,bond:5},result:`你删得很干脆。删完后，你给现在身边的人打了个电话，聊了些有的没的。`,memory:`删掉了{ex}的消息`,goto:b}]},{id:`ev_charity_scam`,chapter:`插曲 · 众筹`,title:`一张病床照片`,art:`ev_charity_scam`,text:[`朋友圈在疯转一个众筹：七岁女孩白血病，还差 80 万。`,`照片上的孩子插着管子，笑得很勉强。不少人@你：「你这么有钱，帮帮她吧。」`],choices:[{text:`直接补齐 80 万`,art:`c_donate_all`,effects:{cash:-80,joy:5},flags:[`fooled_charity`],result:`一个月后新闻曝光：孩子早就痊愈了，照片是三年前的，众筹是她舅舅拿去还赌债的。你盯着那条新闻，很久没动。`,memory:`给一个假众筹捐了 80 万`,goto:b},{text:`先打电话给医院核实`,art:`c_verify_charity`,effects:{safety:10},flags:[`careful_giver`],result:`医院说没有这个病人。你把核实结果发在了朋友圈，被骂「有钱还这么抠」。一周后真相曝光，没人回来道歉。`,memory:`识破了一个假众筹`,goto:b},{text:`去儿童医院，直接问护士`,art:`c_visit_ward`,effects:{cash:-30,bond:10,joy:10},flags:[`charity_seed`],result:`护士长带你看了三个真正交不起费的孩子。你替他们交了钱。其中一个孩子把一颗糖塞进你手里。`,memory:`去儿童医院，替三个孩子交了医药费`,goto:b}]},{id:`ev_hometown`,chapter:`插曲 · 老家`,title:`村口那条土路`,art:`ev_hometown`,text:[`老家村支书打来电话，绕了半天才说正事：村口那条土路，下雨就没法走，修一修要两百万。`,`「修好了，在路口立块碑，刻你的名字。」`],choices:[{text:`修，但碑上刻爸的名字`,art:`c_road_dad`,effects:{cash:-200,bond:15,joy:5},flags:[`hometown_road`],result:`通车那天，爸穿了他最好的那件衬衫，在碑前站了很久，跟每一个路过的人说：「这是我儿女修的。」`,memory:`给老家修了路，碑上刻了爸的名字`,goto:b},{text:`修，什么都不刻`,art:`c_road_quiet`,effects:{cash:-200,joy:10,bond:5},flags:[`hometown_road`],result:`路修好了，没有碑。过年回家，你看见放学的孩子们在新路上骑自行车，骑得飞快。`,memory:`给老家修了路，没留名字`,goto:b},{text:`婉拒，说钱都在理财里`,art:`c_refuse_road`,effects:{bond:-10,safety:5},result:`村支书说「理解理解」。后来你听说，这事在村里传成了「那家孩子发了财，连路都不肯修」。`,memory:`拒绝了给老家修路`,goto:b}]},{id:`ev_ticket_claim`,chapter:`插曲 · 一张传票`,title:`「那张彩票，我也有份」`,art:`ev_ticket_claim`,text:[`一个前同事把你告上了法庭，说那张彩票是你们「合买」的，要分走一半。`,`他拿出的证据，是你们三年前一起吃午饭的照片。`,{if:[{flag:`advisor`}],text:`周律师看完材料，只说了一句：「交给我。」`}],choices:[{text:`请律师，正面应诉`,art:`c_fight_court`,effects:{cash:-20,safety:10,joy:-5},result:`官司打了八个月，你赢了。法官宣判的时候，他没看你。你也没觉得有多高兴。`,memory:`被前同事起诉「合买」，打赢了官司`,goto:b},{text:`给 100 万，私了`,art:`c_settle`,effects:{cash:-100,safety:-10},flags:[`paid_off`],result:`他签了和解书，拿钱走了。三个月后，又有两个「前同事」找上门，说那张彩票他们也有份。`,memory:`花 100 万和前同事私了`,goto:b}]},{id:`ev_dog`,chapter:`插曲 · 雨夜`,title:`跟着你的狗`,art:`ev_dog`,text:[`下雨的晚上，一只瘸了一条腿的小土狗跟了你三条街。`,`你停，它也停；你走，它就一瘸一拐地跟上来。浑身湿透了，尾巴还在摇。`],choices:[{text:`带它回家`,art:`c_adopt_dog`,effects:{cash:-1,joy:15,bond:5},flags:[`dog`],result:`你给它取名叫「五千」。它不知道自己的名字值多少钱，只知道每天傍晚趴在门口等你回家。`,memory:`收养了一只瘸腿小土狗，叫它「五千」`,goto:b},{text:`送去救助站，捐一笔钱`,art:`c_shelter`,effects:{cash:-10,bond:5,joy:5},flags:[`shelter`],result:`救助站的志愿者说，这笔钱够给八十只狗做绝育和疫苗。你走的时候，它在笼子里一直看着你。`,memory:`把流浪狗送去救助站，捐了一笔钱`,goto:b},{text:`买根火腿肠，蹲下喂它`,art:`c_feed_dog`,effects:{joy:5},result:`它吃完，舔了舔你的手，转身钻进了雨里。你在原地蹲了很久。`,memory:`雨夜里，喂了一只流浪狗`,goto:b}]},{id:`ev_wedding`,chapter:`插曲 · 喜帖`,title:`阿杰结婚`,art:`ev_wedding`,text:[`大学室友阿杰要结婚了。`,{if:[{flag:`refused_jie`}],text:`请柬是托别的同学转交的。上面写着你的名字，字迹很工整。`},{if:[{flag:`gifted_jie`}],text:`他亲自送来请柬：「你得来。你坐主桌。」`},{if:[{flag:`helped_jie`}],text:`请柬里夹着一个信封：借你的钱，他已经还了一半。`},{if:[{notFlag:`told_friend`}],text:`你们已经两年没见了。`}],choices:[{text:`去，上台说几句`,art:`c_wedding_speech`,effects:{bond:15,joy:10},flags:[`wedding_speech`],result:`你讲了大学时他把奖学金借给你的事。讲到一半，阿杰在台下哭得比新娘还凶。`,memory:`在阿杰的婚礼上致辞`,goto:b},{text:`人不到，包个大红包`,art:`c_big_red_packet`,effects:{cash:-10,bond:-5},result:`你包了十万。阿杰退回来九万九千八，留了两百：「心意我收了。人没来，我挺难过的。」`,memory:`没去阿杰的婚礼，包了大红包`,goto:b}]},{id:`ev_course`,chapter:`插曲 · 私董会`,title:`98 万的课`,art:`ev_course`,text:[`一个「财富传承私董会」邀请你：三天课程，98 万，「教你守住财富，避免成为下一个破产的中奖者」。`,`讲台上的导师西装笔挺，台下的人哭着喊：「感恩老师！」`],choices:[{text:`报名，学学怎么守财`,art:`c_join_course`,effects:{cash:-98,joy:-5,safety:-5},flags:[`guru`],result:`三天里你学会了喊口号，和「要舍得为认知付费」。结业时导师说，进阶班 298 万。`,memory:`花 98 万上了一个「守财课」`,goto:b},{text:`听完免费的那节就走`,art:`c_free_class`,effects:{joy:5,safety:5},result:`你唯一记住的一句话是导师说的：「守住钱最好的办法，是别让人知道你有钱。」然后他问你要了联系方式。`,memory:`听了一节免费的成功学课，就走了`,goto:b}]},{id:`ev_old_teacher`,chapter:`插曲 · 母校`,title:`王老师`,art:`ev_old_teacher`,text:[`初中的班主任王老师打来电话，声音比记忆里苍老了很多。`,`「学校的图书馆，还是你们那时候那间，漏雨。」她顿了顿，「我不是要钱。就是……想你回来看看。」`],choices:[{text:`捐一座新图书馆`,art:`c_build_library`,effects:{cash:-300,bond:10,joy:10},flags:[`library`],result:`图书馆落成那天，王老师拉着你的手，在新书架前站了很久：「我教了一辈子书，没想到能看到这一天。」`,memory:`给母校捐了一座图书馆`,goto:b},{text:`回去讲一堂课`,art:`c_give_talk`,effects:{joy:10,bond:5},flags:[`gave_talk`],result:`你没讲中奖，讲了自己怎么在漏雨的图书馆里读完了第一本小说。下课时，一个孩子问你：「当有钱人开心吗？」你想了很久。`,memory:`回母校讲了一堂课`,goto:b},{text:`寄一批书，不留名字`,art:`c_send_books`,effects:{cash:-5,joy:5},flags:[`secret_giver`],result:`王老师后来在电话里说：「有人匿名寄了三千本书来。是你吧？」你说不是。她笑了：「那就不是。」`,memory:`匿名给母校寄了三千本书`,goto:b}]},{id:`ev_rich_club`,chapter:`插曲 · 俱乐部`,title:`圈子`,art:`ev_rich_club`,text:[`一个企业家俱乐部邀请你入会，年费五十万。`,`酒会上，大家聊游艇、聊移民、聊孩子上哪所国际学校。有人问你做哪一行，你说「中彩票的」，全场笑了，没人当真。`],choices:[{text:`交钱入会，融入圈子`,art:`c_join_club`,effects:{cash:-50,joy:-5,bond:-5},flags:[`club`],result:`你学会了品酒，学会了打高尔夫，学会了在别人炫耀时恰到好处地点头。只是再没人跟你聊过真心话。`,memory:`花 50 万加入了企业家俱乐部`,goto:b},{text:`喝完这杯就走`,art:`c_leave_party`,effects:{joy:5},result:`你在门口打了辆车。司机放着老歌，一路跟你聊他闺女考上了大学。这是你那晚最开心的十五分钟。`,memory:`去了一次富人俱乐部，没入会`,goto:b}]}],S=[{if:[{flag:`o_coder`}],to:`job_coder`},{if:[{flag:`o_teacher`}],to:`job_teacher`},{to:`job_driver`}],C=x(`spend`),re=[{id:`job`,time:`第 2 周`,chapter:`第四关 · 打工人`,title:`周一早上的闹钟`,art:`job_alarm`,text:[`周一早上七点，闹钟照常响了。`,`你盯着天花板想：我还要去上班吗？`],choices:[{text:`辞职，潇洒走人`,art:`c_quit`,effects:{joy:20,safety:-5},flags:[`quit`],result:`你把闹钟关了，又睡了一个回笼觉。醒来是中午，阳光照在被子上。你已经想不起上次这样醒来是什么时候。`,memory:`辞职了`,goto:S},{text:`继续上班，生活不变`,art:`c_keep_job`,effects:{joy:-5,safety:10},flags:[`keep_job`],result:`你挤上了同一班地铁，站在同一个位置。没人知道，这节车厢里站着一个千万富翁。`,memory:`中奖后，照常上班`,goto:S},{text:`请个长假，出去玩一圈`,art:`c_vacation`,effects:{cash:-50,joy:15},flags:[`travel`],result:`你在海边住了一个月，每天睡到自然醒。第三周开始，你发现自己有点想念工作群的消息提示音。`,memory:`请了一个月长假，去了海边`,goto:S}]},{id:`job_coder`,chapter:`第四关 · 打工人`,title:`会议室`,art:`job_coder`,text:[{if:[{flag:`quit`}],text:`辞职信发出去十分钟，老板把你叫进会议室：「年轻人，要有长期主义。你走了，项目怎么办？」`},{if:[{flag:`keep_job`}],text:`周会上，老板把上线事故的锅甩给了你：「这个问题，某些同学要好好反思。」`},{if:[{flag:`travel`}],text:`你的长假批了，老板附了一句：「回来以后的绩效，你自己心里有数。」`},`你看着他，第一次一点都不慌。`],choices:[{text:`把五年的话一次说完`,art:`c_clapback`,effects:{joy:15,bond:-5},flags:[`clapback`],result:`你说完的时候，会议室安静得能听见空调声。走出门，组里的小王冲你偷偷竖了个大拇指。`,memory:`把憋了五年的话，跟老板说完了`,goto:C},{text:`先把实习生小王带出来`,art:`c_mentor`,effects:{bond:10,joy:5},flags:[`mentor`],result:`你花了一个月，把手上的代码和踩过的坑一点点教给小王。最后一天，他送了你一个键帽，上面刻着「师父」。`,memory:`把手艺教给了实习生小王`,goto:C},{text:`想：要不自己做个产品？`,art:`c_indie`,effects:{joy:10},flags:[`indie_dream`],result:`那天晚上，你翻出了大学时写的一个半成品 App。代码烂得你脸红，但你一口气改到了天亮。`,memory:`翻出了大学时没做完的 App`,goto:C}]},{id:`job_teacher`,chapter:`第四关 · 打工人`,title:`白米饭`,art:`job_teacher`,text:[{if:[{flag:`quit`}],text:`你本来是去学校递辞职信的。`},`午饭时间，你发现班上的小雨又只打了一碗白米饭。`,`家访才知道，她爸妈在外地打工，奶奶腰不好，一个月的生活费是三百块。`,`小雨的作文本上写着：「我的梦想是当一名老师，像我们语文老师一样。」`],choices:[{text:`匿名交了全班一年的午饭钱`,art:`c_lunch_fund`,effects:{cash:-5,joy:10,bond:5},flags:[`secret_giver`],result:`学校说，有一位「热心家长」捐了一笔午餐费。那天中午，小雨的饭盒里多了一只鸡腿。她吃得很慢。`,memory:`匿名给全班交了一年午饭钱`,goto:C},{text:`留下来，把这个班带到毕业`,art:`c_stay_teacher`,effects:{joy:10,bond:10,safety:5},flags:[`stay_teacher`],result:`你把辞职信撕了。明天第一节，还是你的语文课。`,memory:`决定留下来，把这个班带到毕业`,goto:C},{text:`请个代课老师，先歇一歇`,art:`c_substitute`,effects:{joy:5,bond:-5},result:`走的那天，孩子们在黑板上画了一个大大的笑脸。小雨没画，她一直趴在桌上。`,memory:`请了代课老师，离开了讲台`,goto:C}]},{id:`job_driver`,chapter:`第四关 · 打工人`,title:`最后一单`,art:`job_driver`,text:[{if:[{flag:`quit`}],text:`你决定拉完今晚就不干了。`},`凌晨四点，最后一单。后座的中年人喝多了，一直盯着窗外。`,`快到的时候，他忽然开口：「师傅，我跟你说个事你别笑。十年前，我中过 500 万。」`,`「现在嘛……」他晃了晃手机，「刚借了网贷。」`],choices:[{text:`把车停在路边，听他讲完`,art:`c_listen_rider`,effects:{safety:10,joy:-5},flags:[`warned_by_rider`],result:`他讲了一个小时：买车、借钱给朋友、投资、离婚。最后他说：「钱是一点点没的，人是一下子散的。」你记了很多年。`,memory:`凌晨四点，听一个过气的中奖者讲完了他的十年`,goto:C},{text:`送到楼下，扶他上楼`,art:`c_help_rider`,effects:{bond:10},flags:[`kind`],result:`六楼，没电梯。他家门口贴着催缴单。你把他扶进门，帮他倒了杯水，悄悄把车费退了。`,memory:`把一位醉酒的乘客扶上了六楼`,goto:C},{text:`收车后，决定留下这辆旧车`,art:`c_keep_cab`,effects:{joy:10},flags:[`kept_cab`],result:`你把车贷一次还清了。这辆车陪你跑了三十万公里，座椅上有你的形状。你不想卖它。`,memory:`还清车贷，留下了那辆旧车`,goto:C}]}],w=[{if:[{flag:`secret`},{notFlag:`famous`}],to:`parents_unaware`},{to:`relatives`}],ie=[{id:`spend`,time:`第 1 个月`,chapter:`第五关 · 第一笔大钱`,title:`先花在哪`,art:`spend_street`,text:[`你打开购物软件又关上，打开房产中介 App 又关上。`,{if:[{flag:`planner`}],text:`中奖那晚算的账还存在备忘录里，第一行写着：「先别急。」`},`第一笔大钱，该花在哪？`],choices:[{text:`全款买一套大房子`,art:`c_house`,effects:{cash:-1200,joy:15,safety:10},flags:[`house`],result:`交房那天，你一个人在空荡荡的客厅里躺了一下午。回声很大。你说了一句「我回来了」，没有人回答。`,memory:`全款买了一套房`,goto:`luxury`},{text:`买辆梦想中的跑车`,art:`c_car`,effects:{cash:-400,joy:20,safety:-10},flags:[`car`],result:`第一次踩下油门，推背感让你笑出了声。第二周，你发现小区里的人开始绕着你的车拍照。`,memory:`买了一辆跑车`,goto:`luxury`},{text:`给爸妈换套好房子`,art:`c_parents_house`,effects:{cash:-600,bond:20,joy:10},flags:[`parents_house`],result:`新房有电梯，有朝南的大阳台。妈摸着瓷砖说：「这得多贵啊。」爸没说话，在阳台上站了很久。`,memory:`给爸妈换了一套有电梯的房子`,goto:`luxury`},{text:`分几家银行存起来`,hint:`同一家银行的存款保险最多赔 50 万`,art:`c_bank`,effects:{joy:-5,safety:15},flags:[`saved`],result:`你跑了七家银行。柜员们都对你特别客气，但你最喜欢的，是看着存单时那种踏实的感觉。`,memory:`把钱分存进了七家银行`,goto:`luxury`}]},{id:`luxury`,time:`第 2 个月`,chapter:`第五关 · 第一笔大钱`,title:`橱窗`,art:`luxury_store`,text:[`周末你穿着旧卫衣路过商场，走进一家奢侈品店，想看看{luxury}。`,`店员上下打量了你一眼，继续低头玩手机：「那个款，没货。」`,`可你明明看见，它就摆在橱窗里。`],choices:[{text:`刷卡，买下店里最贵的`,art:`c_buy_luxury`,effects:{cash:-80,joy:5,bond:-5},flags:[`show_off`],result:`店长亲自小跑出来，给你倒了香槟。刷卡的那一刻很爽，走出商场五分钟后，那种爽就没了。`,memory:`为了一口气，买下了店里最贵的东西`,goto:w},{text:`笑一笑，转身走了`,art:`c_walk_away`,effects:{joy:5,safety:5},result:`你在楼下买了一杯十块钱的柠檬茶，坐在长椅上喝完了。你发现，你其实也没那么想要。`,memory:`在奢侈品店被冷落，笑着走了`,goto:w},{text:`跟店员聊了几句`,art:`c_chat_clerk`,effects:{bond:5,joy:5},flags:[`empathy`],result:`聊着聊着才知道，她一个月底薪四千，站一天腿是肿的，这个月业绩还差一大截。你买了一条最便宜的丝巾，让她算进业绩。`,memory:`在奢侈品店，听一个店员讲了她的难处`,goto:w}]}],ae=()=>[{if:[{flag:`partner`}],to:`romance_tempt`},{if:[{flag:`famous`}],to:`romance_scam`},{if:[{flag:`posted`}],to:`romance_scam`},{to:`romance_meet`}],T=x(`watched`),oe=[{id:`romance_tempt`,time:`第 1 年 · 秋`,chapter:`第七关 · 心动`,title:`酒会上的{ta}`,art:`romance_tempt_{lover}`,text:[`一场商务酒会。{tempter}走过来，和你碰了碰杯：「听说你最近运气很好？」`,`你们聊了一个小时。被借钱的烦，不敢说真话的累——{ta}全都懂。这些话，伴侣听不懂。`,`手机震了一下，是伴侣：「几点回家？给你留了汤。」`],choices:[{text:`聊着聊着，越了界`,art:`c_affair_{lover}`,effects:{joy:10,bond:-25,safety:-15},flags:[`affair`],result:`一开始只是聊天。后来是吃饭，再后来，你开始给手机设密码。回家的时间越来越晚，那碗汤总是凉的。`,memory:`和酒会上认识的{tempter}越了界`,goto:`romance_affair2`},{text:`留个微信，只做朋友`,art:`c_tempt_friend`,effects:{joy:5,bond:-5,safety:-5},flags:[`loyal`,`tempt_friend`],result:`你们真的只是聊天。可那天伴侣看见你对着手机笑，问「谁啊」，你说「朋友」。那是你第一次只对伴侣说了半句真话。`,memory:`和{tempter}留了微信，只做朋友`,goto:`romance_home`},{text:`笑着说「我该回家了」`,art:`c_go_home`,effects:{bond:10,joy:-10},flags:[`loyal`],result:`汤还是热的。伴侣问酒会怎么样，你想说那个人，想说那些烦心事，最后只说了一句：「没意思。」那些话，你又咽了回去。`,memory:`酒会上，选择了回家喝那碗汤`,goto:`romance_home`}]},{id:`romance_affair2`,time:`第 1 年 · 冬`,chapter:`第七关 · 心动`,title:`凌晨一点的客厅`,art:`romance_caught`,text:[`凌晨一点你回到家，客厅的灯亮着。`,`伴侣坐在沙发上，面前是你忘在家里的另一部手机。屏幕亮着。`,`对方的声音很平静：「我只问一次。」`],choices:[{text:`全部坦白，求对方原谅`,art:`c_confess_affair`,effects:{bond:-10,joy:-15},flags:[`confessed`],result:`你说了很久。对方一直没哭，最后只说：「我需要时间。」那天晚上，你们第一次分房睡。`,memory:`向伴侣坦白了出轨`,goto:T},{text:`撒谎：「只是生意上的朋友」`,art:`c_lie_affair`,effects:{bond:-15,safety:-10},flags:[`lied`],result:`对方看了你很久，点点头，没再问。你以为躲过去了。后来你才知道，那一晚，对方已经约好了律师。`,memory:`对伴侣撒了谎`,goto:T}]},{id:`romance_home`,time:`第 1 年 · 冬`,chapter:`第七关 · 心动`,title:`戒指`,art:`romance_home`,text:[`你们在一起五年了。你在衣柜深处藏了一枚戒指，藏了一个月。`,{if:[{flag:`told_family`}],text:`妈每周都打电话问：「日子到底定了没有？」`},{if:[{flag:`advisor`}],text:`周律师听说了，提醒你：「结婚前，要不要考虑做个婚前财产协议？」`},{if:[{notFlag:`advisor`}],text:`有朋友提醒你：「你现在这个身家，结婚前最好签个婚前协议。」`}],choices:[{text:`求婚，办一场小婚礼`,art:`c_propose`,effects:{cash:-30,bond:15,joy:15},flags:[`married`],result:`婚礼只请了二十个人。对方哭着说的誓词里，没有一句提到钱：「谢谢你在我加班的时候，给我留一盏灯。」`,memory:`和在一起五年的人结婚了`,goto:T},{text:`先签婚前协议，再结婚`,art:`c_prenup`,effects:{bond:-10,safety:15},flags:[`prenup`,`married`],result:`对方签字的时候没说话，签完把笔帽盖好，说：「这样你就放心了吧。」那句话，你记了很久。`,memory:`签了婚前协议后结婚`,goto:T},{text:`再等等，还没想好`,art:`c_wait_marry`,effects:{joy:-5,bond:-5},flags:[`not_yet`],result:`戒指在衣柜里又放了一年。对方从来没问过。有一次你看见对方在翻婚纱照的帖子，看到你进门，飞快地划走了。`,memory:`藏了一枚戒指，迟迟没有求婚`,goto:T}]},{id:`romance_scam`,time:`第 1 年 · 秋`,chapter:`第七关 · 心动`,title:`一个好友申请`,art:`romance_scam_{lover}`,text:[`一个陌生的好友申请：「你好，在新闻上看到你，好佩服你的心态。」`,`头像上的{scammer}好看得不太真实。朋友圈里是海边、马场、米其林，和一句签名：「只想找个真诚的人。」`],choices:[{text:`通过，聊聊看`,art:`c_reply_{lover}`,effects:{joy:10},flags:[`chatting`],result:`{ta}每天给你发早安，记得你随口说过的每一件小事。你开始期待手机震动的声音。`,memory:`加了一个叫{scammer}的陌生人`,goto:`romance_scam2`},{text:`不认识，删掉`,art:`c_delete_friend`,effects:{safety:10},result:`你删得很干脆。一个月后，朋友硬拉你去了一场饭局。`,memory:`删掉了一个可疑的好友申请`,goto:`romance_meet`}]},{id:`romance_scam2`,time:`第 1 年 · 冬`,chapter:`第七关 · 心动`,title:`内部名额`,art:`romance_scam_link`,text:[`聊了一个月，{ta}说想和你一起规划未来。`,`然后发来一个链接：「我舅舅在做的理财平台，内部名额，我自己也投了。你别多想，我只是想让你的钱也安全点。」`],choices:[{text:`为了{ta}，投 500 万`,art:`c_scam_invest_{lover}`,effects:{cash:-500,joy:5},flags:[`scammed_love`],result:`第二天，平台显示你赚了 20 万。{ta}发来一个拥抱的表情：「我就说吧。」`,memory:`在{scammer}推荐的平台投了 500 万`,goto:`romance_scam3`},{text:`先约个视频，见见{ta}`,art:`c_video_call`,effects:{safety:10,joy:-10},result:`{ta}说摄像头坏了，下次吧。第二天，你发现自己被删除了。`,memory:`要求视频，对方消失了`,goto:`romance_blocked`}]},{id:`romance_scam3`,time:`第 1 年 · 冬`,chapter:`第七关 · 心动`,title:`提现失败`,art:`romance_scam_vip`,text:[`你想提现，平台说：要先交 20% 的「个人所得税」，或者再投 1000 万升级 VIP，免税秒到账。`,`{ta}语音里带着哭腔：「我也被卡住了……我们一起再投一点，就能都取出来了。」`],choices:[{text:`再投 1000 万，救我们俩`,art:`c_scam_more`,effects:{cash:-1e3,joy:-10},flags:[`scam_all`],result:`钱转出去的一瞬间，{ta}的头像变成了灰色。`,memory:`又往那个平台投了 1000 万`,goto:`romance_gone`},{text:`停下来，报警`,art:`c_scam_police`,effects:{safety:15,joy:-10},flags:[`reported_scam`],result:`民警听完，叹了口气，拿出一张表让你填。他说你是这个月第七个来报这种案子的。`,memory:`识破了杀猪盘，报了警`,goto:`romance_gone`}]},{id:`romance_gone`,time:`第 2 年 · 春`,chapter:`第七关 · 心动`,title:`{ta}不存在`,art:`romance_gone_{lover}`,text:[`平台打不开了，{ta}的头像变成了灰色。`,`警察告诉你：照片是从网上盗来的，和你聊了几个月的，是境外的一个诈骗团伙。`,{if:[{flag:`scam_all`}],text:`你一共投进去 1500 万。追回的希望，警察说，「不大」。`},`那些早安和晚安，是按话术本发的。`],choices:[{text:`删掉对话框`,art:`c_delete_chat`,effects:{joy:-15,safety:10},goto:T}]},{id:`romance_blocked`,chapter:`第七关 · 心动`,title:`信号不好`,art:`romance_blocked`,text:[`你对着那个删除提示，发了很久的呆。`,`后来你在新闻里看到，有一个团伙专门盯着中奖新闻里的人。你可能是其中之一。`,`一个月后，朋友硬拉你去了一场饭局。`],choices:[{text:`去吧，就当散散心`,goto:`romance_meet`}]},{id:`romance_meet`,time:`第 2 年 · 春`,chapter:`第七关 · 心动`,title:`{crush}`,art:`romance_meet_{lover}`,text:[`朋友组的饭局上，你旁边坐着{crush}。{ta}说话很轻，笑起来眼睛弯弯的。`,`散场的时候，{ta}把手机递过来：「加个微信吧，下次一起去看展。」`,`那天晚上，你们聊到了凌晨两点。`],choices:[{text:`认真追{ta}，并坦白中奖`,art:`c_confess_rich_{lover}`,effects:{joy:10},flags:[`dating`,`showed_rich`],result:`第三次约会，你把一切都说了。{ta}放下了手里的勺子。`,memory:`遇见了{crush}，第三次约会就坦白了中奖`,goto:`romance_doubt`},{text:`约{ta}，但先不提钱`,art:`c_date_plain_{lover}`,effects:{joy:10},flags:[`dating`],result:`你们去看了展，吃了路边摊，在江边走到腿酸。{ta}以为你是个普通的上班族。`,memory:`遇见了{crush}，没提中奖的事`,goto:`romance_true`},{text:`现在的我，不想谈感情`,art:`c_alone`,effects:{safety:5,joy:-5},flags:[`single`],result:`你没有回那条「下次一起去看展」的消息。后来在朋友圈看到，{ta}一个人去了那个展。`,memory:`错过了{crush}`,goto:T}]},{id:`romance_doubt`,chapter:`第七关 · 心动`,title:`{ta}沉默了`,art:`romance_doubt_{lover}`,text:[`听完，{ta}沉默了很久。`,`「我有点怕，」{ta}说，「怕别人说我图你的钱。也怕你以后这么想。」`],choices:[{text:`「我相信你。」`,art:`c_trust_{lover}`,effects:{bond:15,joy:10},flags:[`true_love`],result:`{ta}看了你很久，然后笑了：「那说好了，路边摊还是 AA。」`,memory:`对{crush}说：我相信你`,goto:`romance_quarrel`},{text:`「……其实，我也有点怕。」`,art:`c_doubt_{lover}`,effects:{bond:-10,joy:-15},flags:[`doubt_love`],result:`那天之后，你们都很小心。小心到每次吃饭，都要先算清楚谁付钱。三个月后，{ta}说：「我们这样太累了。」`,memory:`和{crush}之间，隔着一笔钱`,goto:T}]},{id:`romance_true`,time:`第 2 年 · 夏`,chapter:`第七关 · 心动`,title:`路边摊`,art:`romance_true_{lover}`,text:[`你们在一起三个月了。{ta}总抢着付路边摊的钱，说你「工资不高，别乱花」。`,`有一天{ta}说：「我攒了点钱，想开个小店。你觉得我行吗？」`],choices:[{text:`说出真相：「你一定行」`,art:`c_tell_truth_{lover}`,effects:{bond:15,joy:10},flags:[`true_love`],result:`{ta}听完愣了半天，第一句话是：「那你以后不许再抢我付钱。」第二句是：「店我还是要用自己的钱开。」`,memory:`向{crush}坦白了中奖`,goto:`romance_quarrel`},{text:`继续瞒着，试试{ta}的真心`,art:`c_keep_testing_{lover}`,effects:{bond:-10,safety:5},flags:[`tested_love`],result:`你说：「我没钱，帮不上你。」{ta}说：「没关系，我自己来。」那天晚上{ta}算账算到很晚，你假装睡着了。`,memory:`瞒着{crush}，想试试{ta}的真心`,goto:`romance_found`}]},{id:`romance_found`,time:`第 2 年 · 秋`,chapter:`第七关 · 心动`,title:`一条短信`,art:`romance_found_{lover}`,text:[`{ta}帮你拿手机的时候，看到了一条银行短信。余额那一行，有八位数。`,`{ta}没哭，也没吵，只是把手机轻轻放下：「所以这一年，你一直在考我？」`,`「我考及格了吗？」`],choices:[{text:`道歉，把一切说清楚`,art:`c_apologize_{lover}`,effects:{bond:10,joy:-5},flags:[`forgiven`],result:`你说了你的怕：怕被骗，怕被图钱，怕自己不值得被爱。{ta}听完说：「下次害怕的时候，直接告诉我，别考我。」`,memory:`被{crush}发现了秘密，认真道了歉`,goto:T},{text:`「我只是想确定。」`,art:`c_justify`,effects:{bond:-15,joy:-10},flags:[`lost_love`],result:`{ta}点点头，收拾了自己的东西。走之前，把那个小店的钥匙放在了桌上：「我也想确定一件事。现在确定了。」`,memory:`{crush}离开了`,goto:T}]},{id:`romance_quarrel`,time:`第 2 年 · 秋`,chapter:`第七关 · 心动`,title:`饭桌上的一句话`,art:`romance_quarrel_{lover}`,text:[`第一次带{ta}回家吃饭。`,`{ta}去厨房帮忙的时候，你妈压低声音：「隔壁王姨的儿子刚离婚，房子分走一半。你可得防着点。」`,`厨房的门没关。{ta}端着汤，站在门口。`],choices:[{text:`当着{ta}的面，替{ta}说话`,art:`c_stand_up_{lover}`,effects:{bond:5,joy:-10},flags:[`stood_up`],result:`你说：「妈，{ta}比我还怕别人这么想。」妈放下筷子，回了卧室，门关上了。那顿饭剩下你们俩。之后三个月，妈没给你打过电话。`,memory:`在妈面前，替{crush}说了话`,goto:T},{text:`打个圆场，假装没听见`,art:`c_muddle`,effects:{bond:-10,safety:5},result:`那顿饭吃得很客气，妈很满意。回去的路上，{ta}一直看着窗外，只说了一句：「你妈说得也没错。」`,memory:`饭桌上，假装没听见妈的话`,goto:T},{text:`顺势提婚前协议`,art:`c_prenup`,effects:{safety:10,bond:-20},flags:[`prenup`],result:`{ta}把汤放下，说：「好，我签。」声音很平静。后来你们还是在一起，只是{ta}再也没抢着付过钱。`,memory:`向{crush}提了婚前协议`,goto:T}]}],E=ae(),se=[{id:`relatives`,time:`第 3 个月`,chapter:`第六关 · 亲情的价格`,title:`门口排起了队`,art:`relatives_door`,text:[`消息传开了。第一个上门的是二舅——你上大学那年差三千块学费，是他连夜骑摩托送来的。`,`这次是表弟赌球，欠了 300 万。追债的人已经在他家门口泼了红漆。`,`二舅的头发全白了：「就这一次，以后我绑也把他绑住。」`],choices:[{text:`替表弟把债全还了`,art:`c_lend_all`,effects:{cash:-300,bond:10,safety:-10},flags:[`lent_all`],result:`二舅要给你跪下，你拉都拉不住。消息传得比上次还快——那个月，又有七个亲戚加了你的微信。`,memory:`替表弟还了 300 万赌债`,goto:`relatives_later`},{text:`只出 100 万，剩下的不管`,art:`c_lend_some`,effects:{cash:-100,bond:-5},flags:[`lent_some`],result:`二舅接过钱，说了声谢谢，再没多说一句。过年表弟没回来，听说躲去了外地。二舅家的灯，那年一直没怎么亮。`,memory:`替表弟还了一部分赌债`,goto:`parents_proud`},{text:`一分不出，赌债是无底洞`,art:`c_lend_none`,effects:{bond:-20,safety:5},flags:[`refused`],result:`你说的是实话，二舅也知道。他走的时候说：「你说得对。」那年过年，奶奶偷偷问你：「你二舅说你小时候……算了，不说了。」`,memory:`二舅上门求助，一分没出`,goto:`parents_proud`},{text:`让恋人出面挡掉`,art:`c_partner_shield`,effects:{bond:-5,safety:10,joy:-10},requires:[{flag:`partner`}],lockedHint:`需要一个和你一起扛事的人`,result:`恋人说钱都拿去「还房贷」了。二舅骂的是对方，不是你。你躲在卧室里听着，一句话也没出去说。`,memory:`让恋人替你挡下了二舅`,goto:`parents_proud`}]},{id:`relatives_later`,time:`第 9 个月`,chapter:`第六关 · 亲情的价格`,title:`半年后`,art:`relatives_closed`,text:[`半年后，表弟又欠了，这次是 80 万。`,`来借钱的人也越来越多：「你都帮他了，不帮我说不过去吧？」`,`年夜饭桌上，没有人提钱，可每个人看你的眼神都不一样了。`],choices:[{text:`继续借，面子要紧`,art:`c_lend_more`,effects:{cash:-600,bond:-10},flags:[`lent_more`],result:`你借出去的钱，记在一个 Excel 里，已经有 41 行了。还回来的那一列，是空的。`,memory:`又借出去 600 万`,goto:`parents_proud`},{text:`立规矩：以后一律不借`,art:`c_set_rule`,effects:{bond:-10,safety:10},flags:[`refused`],result:`你在家族群里发了一段很长的话。发完你就把手机扣在桌上，半个小时没敢看。`,memory:`在家族群里立了规矩：以后不借`,goto:`parents_proud`},{text:`起诉表弟，把钱要回来`,art:`c_sue_uncle`,effects:{cash:100,bond:-25,joy:-10},flags:[`sued_family`],result:`法院判了，钱追回来一半。二舅在法庭外面对你说：「你小时候，我还给你买过糖。」`,memory:`把表弟告上了法庭`,goto:`parents_proud`}]},{id:`parents_proud`,time:`第 10 个月`,chapter:`第六关 · 亲情的价格`,title:`爸妈变了`,art:`parents_proud`,text:[`妈开始在小区里说「我家孩子出息了」。爸戒了二十年的烟又抽上了——总有人给他递烟。`,{if:[{flag:`sued_family`}],text:`只是二舅家的事，他们一个字都不提。`},`吃饭时，妈说：「县城新楼盘，一百二十平才八十万。回来吧，一家人住一起。」`,`可你的朋友、你的日子，都在城里。`],choices:[{text:`回老家，陪着他们`,art:`c_move_home`,effects:{cash:-80,bond:15,joy:-10},flags:[`moved_home`],result:`县城的日子很慢。妈每天变着法做菜，爸每天去公园下棋。城里的朋友，一个个不再约你了。`,memory:`回了老家，和爸妈住在一起`,goto:E},{text:`不回，但每月回去一趟`,art:`c_talk_parents`,effects:{bond:-5,joy:5},flags:[`talked_parents`],result:`妈说「好，好」，送你到车站。车开出去很远，你回头看，她还站在那儿。`,memory:`没回老家，答应每月回去一趟`,goto:E},{text:`接爸妈来城里住`,art:`c_parents_city`,effects:{cash:-300,bond:10,joy:-5},flags:[`parents_city`],result:`你在自己楼下给他们买了一套。妈第一周就把小区逛熟了。爸却总站在阳台上，看楼下的人下棋，一次也没下去。`,memory:`把爸妈接进了城`,goto:E}]},{id:`parents_unaware`,time:`第 10 个月`,chapter:`第六关 · 亲情的价格`,title:`两贴膏药`,art:`parents_unaware`,text:[`爸妈还不知道你中了奖。`,`妈在电话里说，爸的腰疼了半年，医生让做手术，他不肯：「六万块，够你妈看好几年病了。」`,`他宁可疼着，也不想花孩子的钱。`],choices:[{text:`骗他说医保能全报`,art:`c_checkup`,effects:{cash:-6,bond:5,joy:-5},flags:[`checkup`],result:`手术很顺利，术前检查还查出了血管的问题。爸逢人就夸现在医保真好。出院那天，他想去窗口问问报了多少，你拦了半天。`,memory:`骗爸说医保全报，让他做了手术`,goto:E},{text:`告诉他们真相`,art:`c_tell_truth_parents`,effects:{bond:10,joy:5,safety:-15},flags:[`told_family`],result:`妈的第一反应是：「谁骗你了？」爸的第一反应是：「千万别让你二舅知道。」一个月后，二舅知道了。`,memory:`终于把中奖的事告诉了爸妈`,goto:E},{text:`听他的，先贴着膏药`,art:`c_plaster`,effects:{bond:5,joy:-10},flags:[`respected_dad`],result:`「行，听你的。」爸在电话那头松了口气。后来每次视频，他都坐着不动——你知道，他是怕你看见他走路的样子。`,memory:`尊重了爸的决定，没逼他做手术`,goto:E}]}],D=[{if:[{flag:`bank_product`}],to:`bank_flyer`},{to:`investment`}],O=x(`hospital`),ce=[{id:`bank_flyer`,time:`第 3 年 · 春`,chapter:`第九关 · 钱生钱`,title:`飞单`,art:`bank_flyer`,text:[`那份「专属私行产品」到期了，钱没有回来。`,`银行说，那根本不是他们的产品，是客户经理私下卖的「飞单」。那位经理，上个月已经离职了。`,{if:[{flag:`advisor`}],text:`周律师看完合同，敲了敲桌子：「签字页有问题。这官司能打。」`}],choices:[{text:`让周律师起诉银行`,art:`c_sue_bank_lawyer`,requires:[{flag:`advisor`}],lockedHint:`需要领奖时就请好律师`,effects:{cash:900,safety:10},flags:[`sued_bank`],result:`一年半后，法院判银行承担九成责任。周律师把判决书递给你：「下次签字之前，先拍给我看。」`,memory:`起诉银行，追回了九成本金`,goto:`investment`},{text:`自己找律师，打官司`,art:`c_sue_bank`,effects:{cash:500,joy:-10},flags:[`sued_bank`],result:`官司打了两年，追回一半。你学会了一个词：「风险提示书」。你签过，只是当时没看。`,memory:`和银行打了两年官司，追回一半`,goto:`investment`},{text:`认栽，就当交学费`,art:`c_give_up_bank`,effects:{joy:-15,safety:-5},result:`你把合同锁进抽屉。一千万，换来一句话：越是对你笑的人，越要看清他手里拿着什么。`,memory:`被银行经理骗走 1000 万，认栽了`,goto:`investment`}]},{id:`investment`,time:`第 3 年 · 春`,chapter:`第九关 · 钱生钱`,title:`稳赚不赔？`,art:`invest_cafe`,text:[`钱放着会贬值。所有人都这么说。`,`老同学拿来一份计划书：「年化 30%，稳赚不赔。」朋友圈里有人晒出币圈收益翻了十倍。`,`大学同学老周在做创业公司，想找你当天使投资人。`],choices:[{text:`投 1500 万给老同学`,art:`c_friend_project`,effects:{cash:-1500},flags:[`scam_in`],result:`老同学紧紧握住你的手：「兄弟，这份情我记一辈子。」那份计划书印得很漂亮，你没细看。`,memory:`把 1500 万投给了老同学的项目`,goto:`scam_result`},{text:`拿 500 万跟风买币`,art:`c_crypto`,effects:{cash:-500,joy:5},flags:[`crypto`],result:`你下载了三个交易软件，设了五个价格提醒。从那天起，你每天醒来第一件事是看 K 线。`,memory:`拿 500 万进了币圈`,goto:`crypto_peak`},{text:`投老周的创业公司`,art:`c_angel`,effects:{cash:-500,bond:5},flags:[`angel`],result:`老周的公司做养老陪护机器人，办公室在一个老小区的地下室。他说：「我想让我奶奶这样的老人，不再一个人。」`,memory:`当了老周创业公司的天使投资人`,goto:{pick:[{to:`angel_win`,weight:2},{to:`angel_fail`,weight:3}]}},{text:`分散买指数基金和国债`,art:`c_index_fund`,effects:{safety:15,joy:-5},flags:[`index`],result:`理财经理说你「太保守了」。你不在乎。每年的收益不多，但你晚上睡得着。`,memory:`把钱分散买了指数基金和国债`,goto:O},{text:`开一家自己的小店`,art:`c_own_shop`,effects:{cash:-300,joy:15},flags:[`shop`],result:`你盘下了街角一家小店。装修那一个月，你每天灰头土脸，却比中奖那天还开心。`,memory:`在街角开了一家自己的小店`,goto:`shop_result`}]},{id:`scam_result`,time:`第 3 年 · 夏`,chapter:`第九关 · 钱生钱`,title:`空号`,art:`invest_scam`,text:[`三个月后，老同学的电话变成了空号。`,`你去计划书上的公司地址找，那里是一家打印店。`],choices:[{text:`报警，认栽，吸取教训`,art:`c_report_police`,effects:{joy:-15,safety:10},result:`立案了。民警说，同一个人，名下已经有十一起报案。你是钱最多的那个。`,memory:`被老同学骗走 1500 万，报了警`,goto:O},{text:`再投一笔，把本钱翻回来`,hint:`赌徒的经典台词`,art:`c_double_down`,effects:{cash:-800,joy:-10},flags:[`doubled_down`,`gambling`],result:`你找到了另一个「能帮你追回损失」的项目。他们说，只要再投 800 万，就能连本带利拿回来。`,memory:`为了翻本，又投了 800 万`,goto:O}]},{id:`crypto_peak`,time:`第 3 年 · 夏`,chapter:`第九关 · 钱生钱`,title:`翻了六倍`,art:`crypto_peak`,text:[`牛市来了。你的 500 万，三个月变成了 3000 万。`,`群里所有人都在喊「还能涨十倍」。你已经一周没睡过整觉，手机电量从没低于 80%。`],choices:[{text:`全部卖掉，落袋为安`,art:`c_cash_out`,effects:{cash:3e3,joy:10,safety:5},flags:[`crypto_win`],result:`卖完的第二周，币价腰斩。群里有人哭，有人骂。你卸载了所有软件，睡了一个整觉。`,memory:`在币圈最高点全部卖出`,goto:O},{text:`加杠杆，全梭哈`,art:`c_all_in`,effects:{cash:-1e3,joy:5,safety:-15},flags:[`crypto_all`,`gambling`],result:`你又转进去一千万，开了十倍杠杆。那一晚，你盯着屏幕上的数字，心跳得比中奖那晚还快。`,memory:`在币圈加了十倍杠杆`,goto:`crypto_crash`}]},{id:`crypto_crash`,time:`第 3 年 · 秋`,chapter:`第九关 · 钱生钱`,title:`爆仓`,art:`crypto_crash`,text:[`凌晨四点，手机弹出一条通知：「您的仓位已被强制平仓。」`,`一千五百万，二十分钟，没了。`,`群里有人说：「别慌，抄底的机会来了。」`],choices:[{text:`借钱补仓，一定能回来`,art:`c_borrow_more`,effects:{cash:-300,joy:-15,bond:-10},result:`你向三个朋友借了钱，第一次体会到开口的滋味。你告诉他们：「下个月就还。」`,memory:`爆仓后借钱补仓`,goto:O},{text:`卸载软件，认赔离场`,art:`c_uninstall`,effects:{joy:-15,safety:10},result:`你删掉了所有的交易软件，退出了所有的群。手机安静得让你不习惯。`,memory:`爆仓后认赔离场`,goto:O}]},{id:`angel_win`,time:`第 4 年 · 春`,chapter:`第九关 · 钱生钱`,title:`被收购了`,art:`angel_win`,text:[`老周的公司被一家大企业收购了。你的 500 万，变成了 3000 万。`,{if:[{flag:`o_coder`}],text:`收购合同里写着：机器人的第一版代码，是你周末帮着写的。`},`签约那天，老周喝多了，抱着你说：「当年除了你，没人信我。」`],choices:[{text:`套现，退出`,art:`c_exit_angel`,effects:{cash:2500,joy:10},flags:[`angel_win`],result:`钱到账的那天，你去养老院做了一天志愿者。你看见那些机器人陪着老人下棋，一个老太太笑得像个孩子。`,memory:`投老周的公司，赚了五倍`,goto:O},{text:`留下来，跟老周一起干`,art:`c_join_angel`,effects:{cash:500,joy:15,bond:10},flags:[`angel_win`,`work_again`],result:`你有了一张工牌，职位一栏写着「联合创始人」。每天加班到很晚，你却一次都没失眠。`,memory:`加入了老周的公司，重新开始上班`,goto:O}]},{id:`angel_fail`,time:`第 4 年 · 春`,chapter:`第九关 · 钱生钱`,title:`对不起`,art:`angel_fail`,text:[`老周的公司没撑过第二年。`,`他约你在那个地下室办公室见面，桌上摆着一份打印好的还款计划：「五百万，我这辈子慢慢还你。」`,`他的头发白了一半。`],choices:[{text:`撕掉还款计划`,art:`c_tear_plan`,effects:{bond:15,joy:5},flags:[`angel_friend`],result:`「投资就是投资，」你说，「输了就认。你欠我的是一顿酒，不是五百万。」老周哭了，那晚你们喝到天亮。`,memory:`撕掉了老周的还款计划`,goto:O},{text:`收下，让他慢慢还`,art:`c_keep_plan`,effects:{bond:-5,safety:5},result:`老周每个月准时转你三千块，备注写着「第 N 期」。转到第二十期的时候，他不再回你的朋友圈了。`,memory:`让老周慢慢还那五百万`,goto:O}]},{id:`shop_result`,time:`第 3 年 · 秋`,chapter:`第九关 · 钱生钱`,title:`小店的第一年`,art:`shop_result`,text:[`小店开了一年。算下来，每个月还在亏钱。`,`可是楼下的大爷每天早上来坐一会儿，放学的小孩会趴在柜台上写作业。`,`会计劝你：「关了吧，你又不缺这点钱。」`],choices:[{text:`不关，接着开`,art:`c_keep_shop`,effects:{cash:-100,joy:10,bond:10},flags:[`shop_keep`],result:`你学会了进货、记账、记住每个熟客的口味。有一天你发现，你已经很久没想起过那 5000 万了。`,memory:`小店亏钱，但决定接着开`,goto:O},{text:`关掉，及时止损`,art:`c_close_shop`,effects:{joy:-10,safety:5},result:`关门那天，那个趴在柜台写作业的小孩问你：「以后我去哪写作业呀？」你答不上来。`,memory:`关掉了亏钱的小店`,goto:O}]}],le=[{if:[{stat:`safety`,lte:30}],to:`watched_night`},...D],ue=[{id:`watched`,time:`第 2 年 · 冬`,chapter:`第八关 · 盯上你的人`,title:`同一辆车`,art:`watched_car`,text:[`这周第三次了。你家楼下停着同一辆灰色面包车，车窗贴着深色膜。`,{if:[{flag:`famous`}],text:`你想起那条新闻。全市都见过你的脸。`},{if:[{flag:`car`}],text:`你的跑车停在旁边，在路灯下格外扎眼。`},`你出门，它不动；你回家，它还在。`],choices:[{text:`请两个保镖，24 小时跟着`,art:`c_bodyguard`,effects:{cash:-100,safety:20,joy:-10},flags:[`bodyguard`],result:`从此你去哪都有两个人跟着。很安全。只是你再也没有一个人去楼下吃过一碗面。`,memory:`请了 24 小时贴身保镖`,goto:D},{text:`报警，然后换个城市`,art:`c_relocate`,effects:{cash:-50,safety:15,bond:-10},flags:[`relocated`],result:`你搬到了一座谁也不认识你的城市。新邻居只知道你「做点小生意」。安全了，也孤单了。`,memory:`报了警，搬去了另一座城市`,goto:D},{text:`大概是想多了`,art:`c_shrug`,effects:{safety:-15,joy:5},result:`你把窗帘拉上，打开了电视。面包车第二天就不见了。你松了口气。`,memory:`没把楼下那辆车当回事`,goto:le}]},{id:`watched_night`,chapter:`第八关 · 盯上你的人`,title:`凌晨的声音`,art:`watched_night`,text:[`凌晨三点，你被客厅里的一声轻响惊醒。`,`卧室门缝下面，有手电筒的光，一晃，又一晃。`],choices:[{text:`锁门，压低声音报警`,art:`c_call_110`,effects:{safety:10,joy:-15},flags:[`break_in`],result:`警察七分钟后到了。两个人从阳台跑了，丢下一把撬棍。那七分钟，你这辈子都忘不了。`,memory:`家里半夜进了贼，锁门报了警`,goto:D},{text:`抄起台灯，冲出去`,art:`c_fight_back`,effects:{safety:-5,joy:-10,cash:-20},flags:[`break_in`,`injured`],result:`你的胳膊缝了十一针。他们抢走了你的手表和现金，跑了。医生说：「下次别冲出去，命比钱值钱。」`,memory:`半夜和闯进家的贼搏斗，缝了十一针`,goto:D}]}],de={pick:[{if:[{flag:`checkup`}],to:`dad_recover`,weight:4},{to:`dad_recover`,weight:2},{to:`dad_gone`,weight:1}]},k=x(`birthday`),fe=[{id:`hospital`,time:`第 3 年 · 冬`,chapter:`第十关 · 时间`,title:`妈的电话`,art:`hospital_call`,text:[`凌晨，妈打来电话：「你爸……脑梗，在抢救。」`,{if:[{flag:`parents_house`}],text:`他是在新房的阳台上倒下的，水壶还在地上。`},{if:[{flag:`relocated`}],text:`你在另一座城市。最早的航班，是早上七点。`},{if:[{flag:`checkup`}],text:`医生说，幸好那年查出了血管的问题，一直在吃药。`},`人救回来了。医生说：转去北京做手术，三成风险，做成了能站起来；不转，稳，但以后多半离不开床。`,`爸醒过一次，攥着你的手：「别折腾，别花冤枉钱。」`],choices:[{text:`包机转院，赌一把手术`,art:`c_vip_ward`,effects:{cash:-200,safety:-10,bond:10},flags:[`stayed`,`vip_ward`],result:`医疗转运机，专家团队，手术做了六个小时，你在走廊里数完了所有地砖。爸醒来的第一句话是：「花了多少？」`,memory:`包机送爸去北京，赌了一台手术`,goto:`hospital_night`},{text:`听爸的，留在本地守着`,art:`c_stay_bedside`,effects:{bond:15,joy:-10},flags:[`stayed`,`dad_wish`],result:`你在病房的折叠床上睡了二十一天，爸清醒的时候越来越多。可每次他想下床却站不起来，你都会想：要是当时转了院呢？`,memory:`听了爸的话，没转院，在床边守了二十一天`,goto:`hospital_night`},{text:`请最好的护工，忙完就去`,hint:`手上的项目，几十个人在等你`,art:`c_hire_carer`,effects:{cash:-20,safety:5,joy:-5},flags:[`busy`],result:`护工很专业，每天给你发视频。视频里，爸总是朝镜头摆摆手：「忙你的，我没事。」`,memory:`爸住院，请了护工照顾`,goto:`hospital_late`}]},{id:`hospital_night`,chapter:`第十关 · 时间`,title:`病房的夜`,art:`hospital_night`,text:[`第七天的半夜，爸醒了。他看着天花板，忽然开口：「我梦见你小时候了。」`,`「那时候家里穷，你想要一辆遥控车，我没舍得买。」`,`「后来你再也没跟我要过东西。」`],choices:[{text:`听爸讲他年轻时的事`,art:`c_dad_story`,effects:{bond:10,joy:10},flags:[`dad_talk`],result:`那一夜，爸讲了很多你从没听过的事：他十八岁扒火车去南方，第一次见你妈时紧张得说不出话。你才知道，爸也年轻过。`,memory:`在病房里，听爸讲了一整夜他年轻时的事`,goto:de},{text:`握着爸的手，说声谢谢`,art:`c_dad_thanks`,effects:{bond:15,joy:5},flags:[`dad_said`],result:`「爸，谢谢你。」你说完，爸把脸转向窗户，很久没转回来。他的手，一直没松开。`,memory:`握着爸的手，说出了那句「谢谢」`,goto:de}]},{id:`hospital_late`,chapter:`第十关 · 时间`,title:`「再等两天」`,art:`hospital_late`,text:[`第五天，你还在谈一个很重要的项目。护工发来的视频里，爸说话越来越慢了。`,`妈打来电话，没有哭，只是问：「你什么时候回来？」`,`对面的合作方看了看表：「我们再给你两天时间考虑。」`],choices:[{text:`推掉项目，马上回去`,art:`c_go_now`,effects:{bond:10,joy:-5},flags:[`came_back`],result:`项目黄了。你冲进病房的时候，爸正在喝粥，看见你，愣了一下，笑了：「不是让你忙你的吗？」`,memory:`推掉项目，赶回了爸的病床前`,goto:de},{text:`谈完这两天就回去`,art:`c_two_days`,effects:{cash:200,joy:-10},flags:[`missed_dad`],result:`项目谈成了。签完字，你看到手机上有十二个未接来电。`,memory:`留下来把项目谈完了`,goto:`missed_dad`}]},{id:`missed_dad`,time:`第 3 年 · 冬`,chapter:`第十关 · 时间`,title:`空病床`,art:`missed_dad`,text:[`你赶到的时候，病床已经空了。`,`妈递给你一个塑料袋：爸的老花镜，一部旧手机，和一张折起来的纸。`,`纸上是爸歪歪扭扭的字：「别怪自己。爸知道你忙。」`],choices:[{text:`在空病房里坐了一夜`,art:`c_sit_night`,effects:{joy:-20,bond:5},result:`护士没有赶你走。天亮的时候，你把那张纸叠好，放进了钱包最里面那一层。`,memory:`没赶上见爸最后一面`,goto:k},{text:`把爸的旧手机充上电`,art:`c_dad_phone`,effects:{joy:-15,bond:10},flags:[`keep_phone`],result:`相册里全是你：你的毕业照，你的新闻截图，你朋友圈里的每一张照片。最后一张，是他偷偷拍的你的背影。`,memory:`没赶上见爸最后一面，留下了他的旧手机`,goto:k}]},{id:`dad_recover`,time:`第 4 年 · 春`,chapter:`第十关 · 时间`,title:`拐杖`,art:`dad_recover`,text:[{if:[{notFlag:`dad_wish`}],text:`爸挺过来了。出院那天，他拄着拐杖，不让任何人扶。`},{if:[{flag:`dad_wish`}],text:`爸挺过来了，只是再没站起来。出院那天，他坐在轮椅上，非要自己推。`},`「我好着呢，」他说，「还能再看你好多年。」`,`医生私下告诉你：「以后的每一年，都是赚的。」`],choices:[{text:`接爸妈来一起住`,art:`c_live_together`,effects:{bond:10,joy:5},flags:[`live_together`],result:`家里突然变得很吵：早上五点的收音机，饭桌上的唠叨，阳台上越来越多的花盆。你发现自己很久没有失眠了。`,memory:`爸出院后，接爸妈来一起住`,goto:k},{text:`每周回家吃一顿饭`,art:`c_weekly_home`,effects:{bond:10,joy:5},flags:[`weekly_home`],result:`每个周日，你都会回家。爸会提前一天去菜市场挑鱼。你们俩还是话不多，但每次走的时候，他都会送到楼下。`,memory:`每个周日都回家吃饭`,goto:k}]},{id:`dad_gone`,time:`第 4 年 · 春`,chapter:`第十关 · 时间`,title:`爸走了`,art:`dad_gone`,text:[`爸没能挺过那个冬天。`,{if:[{flag:`stayed`}],text:`护士说，他最后那几天一直在笑，跟隔壁床的人说：「我孩子守了我好多天，一步都没离开。」`},{if:[{flag:`came_back`}],text:`护士说，他最后那几天一直在笑，跟隔壁床的人说：「我孩子回来了，什么项目都不要了。」`}],choices:[{text:`陪妈去爸一直想去的海边`,art:`c_trip_mom`,effects:{cash:-10,bond:15,joy:5},flags:[`lost_dad`,`trip_mom`],result:`妈带着爸的照片，在海边站了很久。她说：「你爸年轻时候说，攒够了钱就带我来。后来钱一直没攒够。」`,memory:`爸走后，陪妈去了他一直想去的海边`,goto:k},{text:`把爸的遗物整理好`,art:`c_dad_things`,effects:{joy:-10,bond:5},flags:[`lost_dad`],result:`在爸的抽屉里，你找到一辆崭新的遥控车，盒子还没拆。购买小票上的日期，是你中奖那年。`,memory:`在爸的抽屉里，找到一辆没拆封的遥控车`,goto:k}]}],A=x(`empty`),pe=[{id:`birthday`,time:`第 4 年 · 夏`,chapter:`第十一关 · 朋友`,title:`生日快乐`,art:`birthday`,text:[`又一个生日。手机里有两千多个联系人，生日祝福刷了满屏。`,{if:[{flag:`club`}],text:`俱乐部的人送来一瓶你叫不出名字的酒。`},`可你翻了一圈，找不到一个人知道你爱吃什么口味的蛋糕。`],choices:[{text:`包下顶楼，办一场大派对`,art:`c_big_party`,effects:{cash:-50,joy:-5},flags:[`party`],result:`来了两百个人，香槟塔有六层。大家举着手机拍照，没有一个人唱完那首生日歌。散场后你一个人吃了一块蛋糕，是芒果味的，你不爱吃芒果。`,memory:`生日那天，办了一场两百人的派对`,goto:`old_friend`},{text:`一个人吃碗长寿面`,art:`c_birthday_noodle`,effects:{joy:5},flags:[`alone_birthday`],result:`面馆老板娘多给你卧了一个蛋：「过生日吧？看你一个人。」你说是。她又给你加了一勺辣油。`,memory:`生日那天，一个人吃了碗长寿面`,goto:`old_friend`},{text:`回家，和家人吃顿饭`,art:`c_home_birthday`,effects:{bond:10,joy:10},flags:[`home_birthday`],result:`妈做了一桌子菜，全是你小时候爱吃的。蛋糕是楼下面包店买的，奶油有点腻。你吃了两块。`,memory:`生日那天，回家吃了顿饭`,goto:`old_friend`}]},{id:`old_friend`,chapter:`第十一关 · 朋友`,title:`零点的消息`,art:`old_friend`,text:[`零点整，手机亮了一下。是阿杰：「生日快乐，老三。」`,`「老三」是你大学宿舍的排行。已经很多年没人这么叫你了。`,{if:[{flag:`refused_jie`}],text:`那年借钱的事之后，这是他第一次给你发消息。`},{if:[{flag:`wedding_speech`}],text:`他的头像，是你在婚礼上致辞时他偷拍的照片。`},{if:[{flag:`gifted_jie`}],text:`后面还有一句：「我爸透析三年了，挺好的。谢谢你。」`},`过了一会儿，又一条：「孩子明年上学，还差 5 万……不方便就当我没说。」`],choices:[{text:`约他出来，喝一杯`,art:`c_meet_jie`,effects:{bond:15,joy:10,cash:-5,safety:-5},flags:[`reunited`],result:`还是大学后门那家烧烤摊。你们聊到凌晨三点，谁都没提那 5 万。散场时你悄悄结了学费。半年后，他又开了口。`,memory:`和阿杰在烧烤摊喝到凌晨，替他交了学费`,goto:A},{text:`打过去，说声对不起`,art:`c_sorry_jie`,requires:[{flag:`refused_jie`}],lockedHint:`你们之间，好像没有需要道歉的事`,effects:{bond:20,joy:5,cash:-5},flags:[`reunited`,`apologized_jie`],result:`电话接通，你只说了一句「那年对不起」，阿杰就在那头骂：「你他妈的，我等你这句等了三年。」学费的事，他没再提，你第二天转了过去。`,memory:`给阿杰打电话，为当年的事道了歉`,goto:A},{text:`直接转钱，不见面`,art:`c_pay_jie`,effects:{cash:-5,bond:-5,safety:5},flags:[`paid_jie`],result:`你转了 5 万，备注「给孩子的」。他收了，回了一长串谢谢。你突然想不起来，你们上一次见面是哪一年。`,memory:`给阿杰转了 5 万，没有见面`,goto:A},{text:`回句「谢谢」，装没看见`,art:`c_reply_thanks`,effects:{bond:-10,safety:5},result:`他回了一个笑脸，后面那条，很快撤回了。你们的对话框，又安静了一年。`,memory:`收到阿杰的生日祝福，只回了句谢谢`,goto:A}]}],j=[{if:[{flag:`lottery_again`},{flag:`would_buy`}],to:`end_again`},{if:[{flag:`lottery_habit`},{stat:`joy`,lte:70}],to:`end_again`},{if:[{flag:`gambling`}],to:`end_gambler`},{if:[{stat:`cash`,lte:299}],to:`end_broke_again`},{if:[{flag:`missed_dad`}],to:`end_too_late`},{if:[{flag:`affair`},{notFlag:`confessed`}],to:`end_affair`},{if:[{flag:`sued_family`}],to:`end_family_feud`},{if:[{flag:`prenup`},{stat:`joy`,lte:70}],to:`end_cold_marriage`},{if:[{flag:`scammed_love`},{stat:`joy`,lte:75}],to:`end_scammed_love`},{if:[{flag:`streamer`},{stat:`safety`,lte:60}],to:`end_livestream`},{if:[{flag:`bodyguard`},{stat:`joy`,lte:70}],to:`end_bodyguard`},{if:[{stat:`bond`,lte:60},{notFlag:`reunited`}],to:`end_lonely_rich`},{if:[{flag:`angel_win`}],to:`end_angel`},{if:[{flag:`o_teacher`},{flag:`stay_teacher`}],to:`end_teacher`},{if:[{flag:`o_coder`},{flag:`indie_dream`}],to:`end_coder`},{if:[{flag:`o_driver`},{flag:`kept_cab`}],to:`end_driver`},{if:[{flag:`shop_keep`}],to:`end_shop`},{if:[{flag:`true_love`},{notFlag:`prenup`},{stat:`bond`,gte:60}],to:`end_true_love`},{if:[{flag:`forgiven`},{stat:`bond`,gte:60}],to:`end_true_love`},{if:[{flag:`stayed`},{flag:`lost_dad`},{stat:`bond`,gte:70}],to:`end_bedside`},{if:[{flag:`charity`}],to:`end_philanthropist`},{if:[{flag:`world`}],to:`end_traveler`},{if:[{flag:`secret`},{notFlag:`told_family`},{stat:`safety`,gte:60}],to:`end_invisible`},{if:[{flag:`reunited`},{stat:`bond`,gte:75}],to:`end_old_friends`},{if:[{flag:`rural`}],to:`end_countryside`},{if:[{flag:`work_again`}],to:`end_meaning`},{if:[{flag:`therapy`},{stat:`joy`,gte:60},{stat:`bond`,gte:60}],to:`end_happy`},{if:[{flag:`shopping`}],to:`end_ordinary`},{if:[{flag:`stayed`},{flag:`dad_said`},{stat:`bond`,gte:85}],to:`end_bedside`},{if:[{stat:`joy`,gte:60},{stat:`bond`,gte:65}],to:`end_happy`},{to:`end_ordinary`}],me=[{id:`empty`,time:`第 4 年 · 冬`,chapter:`第十二关 · 空心`,title:`凌晨三点`,art:`empty_night`,text:[`想要的东西，好像都有了。`,`可你开始失眠。凌晨三点刷着手机，突然很想念以前挤地铁、和同事抢外卖的日子。`,{if:[{flag:`lost_dad`}],text:`你又梦见了爸。梦里他在阳台上浇花，回头问你：「吃了没？」`},`原来钱能买到的东西，人很快就会习惯。`],choices:[{text:`去做心理咨询`,art:`c_therapy`,effects:{cash:-5,joy:10,safety:10},flags:[`therapy`],result:`咨询师听你讲了一个小时，然后问：「中奖之前，你最想要的是什么？」你张了张嘴，发现自己已经忘了。`,memory:`开始做心理咨询`,goto:`finale`},{text:`找一份真正想做的工作`,art:`c_work_again`,effects:{joy:10,bond:5},flags:[`work_again`],result:`新工作薪水不高，同事们都不知道你的底细。第一次被领导夸「做得不错」的时候，你高兴了一整天。`,memory:`重新找了一份真正想做的工作`,goto:`finale`},{text:`成立一个助学基金`,art:`c_charity`,requires:[{stat:`cash`,gte:1200}],lockedHint:`剩下的钱，已经撑不起一个基金了`,effects:{cash:-1e3,joy:15,bond:10},flags:[`charity`],result:`你跑了七个县，见了上百个孩子。有个女孩说她想当宇航员，说完自己先笑了，好像这是个笑话。你没笑。`,memory:`拿出 1000 万成立了助学基金`,goto:`finale`},{text:`背上包，去环游世界`,art:`c_world`,effects:{cash:-200,joy:15},flags:[`world`],result:`你在冰岛看了极光，在撒哈拉睡过帐篷。每到一个地方，你都会拍一张照片，然后不知道该发给谁。`,memory:`背上包，走了四十个国家`,goto:`finale`},{text:`回老家，种地养鸡`,art:`c_rural`,effects:{cash:-50,joy:15,safety:10},flags:[`rural`],result:`你在老家盖了个小院，种了一片菜地，养了十几只鸡。第一季的西红柿全被虫吃了。你蹲在地头笑出了声。`,memory:`回老家盖了个小院`,goto:`finale`},{text:`继续买买买，把空填满`,art:`c_shopping`,effects:{cash:-800,joy:-10},flags:[`shopping`],result:`快递堆满了玄关，很多连拆都没拆。你买了很多东西，可那个空，越来越大。`,memory:`用购物填满每一个失眠的夜`,goto:`finale`},{text:`把剩下的钱，全部捐掉`,hint:`走过很多种人生之后才会出现的选项`,art:`c_give_all`,requires:[{seenCount:8},{stat:`cash`,gte:1e3}],lockedHint:`再多看几种人生（解锁 8 个结局，且存款还有 1000 万以上）`,effects:{cash:-99999},flags:[`give_all`],result:`签完最后一份捐赠协议，你走出公证处，摸了摸口袋：一张公交卡，一把钥匙，还有二十块零钱。你突然觉得很轻。`,memory:`把剩下的钱全部捐了`,goto:`end_give_all`}]},{id:`finale`,time:`第 5 年`,chapter:`终章`,title:`最后一个问题`,art:`finale`,text:[`五年过去了。你翻着这些年的照片，一张一张。`,`有个声音问你：如果能回到那个晚上——泡面、手机、那张彩票——`,`你还会去买它吗？`],choices:[{text:`会。再来一次也会`,art:`c_would_buy`,flags:[`would_buy`],result:`你笑了。不管怎么说，那是一段谁也替你走不了的路。`,memory:`如果能重来，还会买那张彩票`,goto:j},{text:`不会。我想要原来的日子`,art:`c_would_not`,flags:[`would_not`],result:`你想起那间出租屋，那碗泡面，那个还不知道明天会怎样的自己。原来那时候，你也挺好的。`,memory:`如果能重来，不会再买那张彩票`,goto:j},{text:`我不知道`,art:`c_unsure`,flags:[`unsure`],result:`你合上相册。有些问题，可能要用一辈子来回答。`,memory:`如果能重来……不知道`,goto:j}]}],he=[{if:[{flag:`dog`}],text:`「五千」趴在你脚边，打着呼噜。`},{if:[{flag:`would_buy`}],text:`如果能重来，你说你还会买。`},{if:[{flag:`would_not`}],text:`如果能重来，你说你不会再买了。`},{if:[{flag:`unsure`}],text:`如果能重来……你还没有答案。`}],ge=[`end_true_love`,`end_scammed_love`],M=(e,t,n=[])=>({id:e,chapter:`结局`,title:t.title,art:ge.includes(e)?`${e}_{lover}`:e,text:[t.summary,...n,...he],ending:t}),_e=[M(`end_unclaimed`,{title:`没去领的 5000 万`,rank:`S`,hidden:!0,hint:`有一种选择，是不去选`,summary:`60 天后，那张彩票过期了。有人说你傻。你只是终于明白：你想要的那些东西，从来不在那张彩票里。`,reflection:`如果明天就能拿到 5000 万，你最想改变的，是钱能改变的那部分吗？`}),M(`end_arrested`,{title:`铁窗里的千万富翁`,rank:`D`,hint:`有人说，可以不交税`,summary:`那张彩票成了证物。你本可以拥有 4000 万，现在拥有的，是一段漫长的、可以用来反思的时间。`,reflection:`为了不失去 1000 万，你愿意冒失去什么的风险？`}),M(`end_conned`,{title:`交出去的彩票`,rank:`D`,hint:`中间人很热情`,summary:`中间人的电话再也没打通过。那张彩票被人兑走了。你连报警时都说不清：你到底是受害者，还是同谋？`,reflection:`当一件事好得不像真的，你为什么还是愿意相信？`}),M(`end_lost_ticket`,{title:`过期的 5000 万`,rank:`D`,hint:`明天再说吧`,summary:`第 61 天，你终于赶到了。工作人员遗憾地告诉你：兑奖期已过，奖金已经纳入彩票公益金。`,reflection:`你有没有一件事，也一直在等「准备好了再说」？`}),M(`end_bankrupt`,{title:`一夜回到解放前`,rank:`D`,hint:`花钱的速度，比想象中快`,summary:`银行卡余额归零的那天，你又一次窝在出租屋的沙发上，点开了开奖直播。`,reflection:`钱花光的那一刻，你最后悔的是哪一个选择？`}),M(`end_again`,{title:`又一张彩票`,rank:`C`,hidden:!0,hint:`那家彩票站的老板，一直记得你`,summary:`第五年的一个晚上，你又走进了那家彩票站。老板笑着说：「还是老号码？」你点点头。好像一切，又回到了那个晚上。`,reflection:`你想要的，是那 5000 万，还是等开奖时那一晚的心跳？`}),M(`end_gambler`,{title:`赌桌上的人`,rank:`D`,hint:`想把输掉的赢回来`,summary:`你已经记不清输了多少。你只记得，每一次都告诉自己：最后一把，翻了本就收手。`,reflection:`你真正停不下来的，是想赢，还是不敢承认输了？`}),M(`end_broke_again`,{title:`来过，又走了`,rank:`C`,hint:`钱会自己走掉`,summary:`钱像潮水一样退去。你还剩一点存款，和一堆「早知道」。`,reflection:`如果钱终究会离开，有什么是留得下来的？`}),M(`end_too_late`,{title:`十二个未接来电`,rank:`D`,hint:`再等两天`,summary:`那份谈成的合同，你后来再也没打开过。爸的老花镜放在你的床头，镜片上有一道划痕，你一直没舍得擦。`,reflection:`有什么事，是你一直以为「以后还有时间」的？`}),M(`end_affair`,{title:`分走的不只是一半`,rank:`C`,hint:`酒会上的那杯香槟`,summary:`离婚协议签完，对方只带走了一个行李箱，和那只熬汤的砂锅。后来你才明白，你失去的不只是一半的钱。`,reflection:`当你什么都买得起的时候，有什么是不该买的？`}),M(`end_cold_marriage`,{title:`签了字的爱`,rank:`C`,hint:`把一切都写进协议里`,summary:`你们还在一起，财产分得清清楚楚，家务也分得清清楚楚。只是很久没有一起，在路边摊抢着付过钱了。`,reflection:`你保护住的，是钱，还是那个不敢被辜负的自己？`}),M(`end_scammed_love`,{title:`{ta}不存在`,rank:`C`,hint:`一个好看得不太真实的人`,summary:`你还是会偶尔打开那个对话框。最后一条消息停在：「晚安，明天见。」`,reflection:`让你心动的，是{ta}，还是有人精心为你设计好的样子？`}),M(`end_livestream`,{title:`下播之后`,rank:`C`,hint:`家人们，点点关注`,summary:`你有了两百万粉丝，和一个被扒得干干净净的人生。每次下播，你都要在黑掉的屏幕前坐很久，才想起自己原来的样子。`,reflection:`被很多人看见，和被一个人懂得，你更想要哪一个？`}),M(`end_bodyguard`,{title:`被保护的人`,rank:`C`,hint:`24 小时都很安全`,summary:`五年里，你没出过一次事。也没有一个人，跟你在街边并肩走过。保镖换了三批，每一批都说你是个「好雇主」。`,reflection:`让你安全的东西，是不是也把你关了起来？`}),M(`end_family_feud`,{title:`赢了官司，输了家`,rank:`C`,hint:`和亲戚，讲道理`,summary:`钱追回来了一半。奶奶的葬礼上，二舅一家站在最远的角落，没有人看你。你站在人群中间，像个外人。`,reflection:`有些账算清楚了，为什么反而回不去了？`}),M(`end_lonely_rich`,{title:`孤独的富翁`,rank:`C`,hint:`一个人，也挺好`,summary:`你很有钱。只
